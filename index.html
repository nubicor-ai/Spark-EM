 p:"Miller-Fisher: ophthalmoplegia, ataxia, areflexia after recent illness; anti-GQ1b antibodies; consider LP."},
{c:"Diplopia",l:3,v:"45F: severe headache, fever, neck stiffness, bilateral eye findings, proptosis, chemosis, CN III and VI palsies, periorbital numbness, after a facial infection.",
 d:["Septic cavernous sinus thrombosis","Orbital myositis","Thyroid eye disease","Microvascular CN VI palsy"],
 dw:"Combined palsies of CN III, IV, VI with retro-orbital pain, exophthalmos, conjunctival injection/chemosis and facial numbness (V1/V2) = cavernous sinus or orbital apex process. Bilateral findings because the sinuses communicate.",
 s:["Contrast MRI/CT orbits +/- brain, blood cultures, empiric IV antibiotics, admit","Oral steroids","Discharge with follow-up","Outpatient eye exam"],
 sw:"Orbital apex syndrome differs from cavernous sinus by reduced visual acuity (optic nerve). Herpes zoster ophthalmicus is a described cause.",
 p:"CN VI is the first cavernous-sinus nerve affected because it runs through the sinus lumen, while III, IV, V1, V2 run in the wall."},
{c:"Diplopia",l:2,v:"46F with painful eye movement, eyelid swelling, periorbital edema, proptosis in one eye, and diplopia worse looking in direction of the affected muscle. No fever.",
 d:["Orbital myositis / idiopathic orbital inflammatory syndrome","Cavernous sinus thrombosis","Aneurysm","Myasthenia"],
 dw:"Structural orbitopathy or myositis: pain, restriction of movement, periorbital edema, exophthalmos and chemosis; mechanical diplopia.",
 s:["Contrast-enhanced MRI or CT of the orbits, then ophthalmology/steroid plan","Emergent LP","Discharge without imaging","Thiamine"],
 sw:"Giant cell arteritis can cause orbital myositis with headache, scalp tenderness, jaw claudication or vision changes in older patients.",
 p:"Thyroid eye disease: enlarged/fibrotic extraocular muscles, proptosis, lid retraction, conjunctival edema; restricts elevation and abduction first."},

{c:"Red Eye",l:2,v:"29F splashed with drain cleaner in her eye 10 minutes ago. Severe pain and tearing.",
 d:["Caustic (alkali) injury","Corneal abrasion","Conjunctivitis","Acute angle closure glaucoma"],
 dw:"Fig 18.8 critical triage: contaminating material, acid, alkali or corrosive = caustic injury (Critical).",
 s:["Immediate copious irrigation with tap water or sterile saline until tear-film pH 7 (alkali: at least 4 L over 40 min); ophthalmology","Examine first, then irrigate","Patch the eye","Topical antibiotics only"],
 sw:"Acids: minimum 2 L and 20 min. Alkalis: minimum 4 L and 40 min. Solids: lift particles with a dry swab before irrigation. Discharge only if pH 7 and no abnormal findings.",
 p:"Do not wait for visual acuity or workup before irrigation."},
{c:"Red Eye",l:3,v:"40M with blunt periocular trauma: proptosis, decreased vision, painful limited eye movement, hard globe. IOP 45 mm Hg.",
 d:["Orbital compartment syndrome (retrobulbar hematoma)","Hyphema","Corneal abrasion","Subconjunctival hemorrhage"],
 dw:"Table 18.1 #2: exophthalmos, decreased visual acuity, painful or limited ocular mobility and increased IOP. Critical.",
 s:["Lateral canthotomy and cantholysis in the ED, with ophthalmology; measure IOP unless a ruptured globe is possible","Observation","Eye patch and discharge","Topical timolol only"],
 sw:"IOP >30 mm Hg may require lateral canthotomy and cantholysis. Correct any coagulopathy; CT of brain and orbits.",
 p:"Do not measure IOP if you suspect a ruptured globe."},
{c:"Red Eye",l:3,v:"33M hit by flying metal: teardrop pupil, blood in the anterior chamber, loss of red reflex.",
 d:["Penetrating injury of the globe (ruptured globe)","Corneal abrasion","Hyphema only","Subconjunctival hemorrhage"],
 dw:"Localized redness at site of entry plus teardrop pupil, blood in anterior chamber or loss of red reflex = penetrating injury (Emergent).",
 s:["Shield (do not pressure) the eye, analgesia and antiemetic, IV antibiotic and tetanus, ophthalmology to ED","Measure IOP","Patch and discharge","Topical anesthetic and drops"],
 sw:"Protect the eye from further pressure, relieve pain, prevent vomiting. Parenteral antibiotics and tetanus prophylaxis. Admit for antibiotics and procedure.",
 p:"A positive Seidel test shows a full-thickness corneal injury."},
{c:"Red Eye",l:2,v:"35M after a punch: blood layering in the anterior chamber, pain and blurred vision. No globe rupture on exam.",
 d:["Hyphema","Subconjunctival hemorrhage","Corneal abrasion","Orbital compartment syndrome"],
 dw:"Table 18.1 #4: pain, decreased acuity, gross blood in anterior chamber, possibly fixed dilated pupil after blunt trauma.",
 s:["Rule out open globe, measure IOP, head elevation, shield, avoid NSAIDs; ophthalmology follow-up within 2 days","Patch both eyes","Discharge with aspirin","Dilate and discharge"],
 sw:"Most can be discharged with careful return instructions: decrease activity, sleep with eye shield, keep eye open while awake. Sickle cell trait/disease and coagulopathy patients may be admitted. IOP >30 may need glaucoma meds.",
 p:"Grade by percentage of vertical diameter of the anterior chamber with blood layered upright."},
{c:"Red Eye",l:1,v:"26M with a painless bright red patch on the white of the eye after coughing, vision normal.",
 d:["Subconjunctival hemorrhage","Acute angle closure glaucoma","Hyphema","Scleritis"],
 dw:"Red blood beneath a clear conjunctival membrane without pain is subconjunctival hemorrhage (non-urgent).",
 s:["Reassure: it resolves in 2-3 weeks; check coagulation only if indicated","Emergent CT","Ophthalmology consult tonight","Antibiotic drops"],
 sw:"Pain raises concern for more serious causes such as direct globe injury or a retrobulbar process.",
 p:"Exclude coagulopathy or thrombocytopenia if history suggests it."},
{c:"Red Eye",l:1,v:"22M contact lens wearer: pain, foreign-body sensation, tearing and photophobia after a scratch. Fluorescein shows an epithelial defect, no hypopyon.",
 d:["Corneal abrasion","Acute angle closure glaucoma","Anterior uveitis","Viral conjunctivitis"],
 dw:"Table 18.1 #8: history of direct trauma or foreign body plus visual defect in the corneal epithelium on fluorescein. Surrounding edema implies keratitis.",
 s:["Antibiotic prophylaxis (polymyxin B/trimethoprim drops; for contact lens wearers consider fluoroquinolone), analgesia, no patch, follow-up in 1-3 days","Patch the eye","Prescribe topical steroids","Take-home topical anesthetic"],
 sw:"Topical anesthetics only sparingly, for simple abrasions, no home use unless with ophthalmology. Rule out corneal penetration with Seidel test; evert eyelids for foreign body.",
 p:"Fluorescein concentrates where corneal epithelium is breached; use cobalt blue light."},
{c:"Red Eye",l:2,v:"30F, painful red eye with branching dendritic lesion on fluorescein under blue light. History of cold sores.",
 d:["Herpetic keratitis","Bacterial keratitis","Corneal abrasion","Viral conjunctivitis"],
 dw:"Fig 18.11: abnormal cornea under white or blue light with lesion having a dendritic pattern = herpetic keratitis.",
 s:["Topical antiviral (acyclovir 5% ointment or trifluridine 1% solution) with ophthalmology; no steroids, no patch","Topical steroid drops","Fluoroquinolone only","Reassure"],
 sw:"Acyclovir typical dosing five times a day for 7 days; trifluridine 1 drop every 2 h for 7 days then taper. Look for zoster, varicella or CMV in immunocompromised.",
 p:"Topical corticosteroids can prolong viral infection and should be avoided."},
{c:"Red Eye",l:3,v:"58F with sudden severe eye pain, blurred vision, frontal headache, nausea and vomiting. Fixed mid-dilated pupil, limbal injection, shallow anterior chamber.",
 d:["Acute (narrow) angle closure glaucoma","Anterior uveitis","Bacterial keratitis","Temporal arteritis"],
 dw:"Table 18.1 #18: sudden eye pain, blurred vision with headache, nausea and vomiting, pupil fixed at midsize, limbal injection.",
 s:["Measure IOP; topical timolol 0.5%, apraclonidine 1%, dorzolamide 2%, prednisolone 1%, pilocarpine after IOP <50; mannitol 2 g/kg IV; ophthalmology","Dilate the pupil","Patch the eye","Oral antibiotics"],
 sw:"Acetazolamide/methazolamide 50 mg PO if sickle cell; use methazolamide instead of dorzolamide. Pilocarpine 1-2% after IOP <50, repeat in 15 min. Mydriatics are contraindicated in narrow-angle glaucoma.",
 p:"Treat in ED if IOP >30 mm Hg. Discuss any IOP >20 with the ophthalmologist."},
{c:"Red Eye",l:3,v:"62M, 1 week after cataract surgery: progressively worse eye pain, decreasing vision, no red reflex, hypopyon, chemosis, eyelid swelling.",
 d:["Endophthalmitis","Anterior uveitis","Bacterial conjunctivitis","Corneal abrasion"],
 dw:"Table 18.1 #22: progressively increasing pain and decreasing vision, diminished red reflex, cells and flare, possibly hypopyon.",
 s:["Empiric parenteral antibiotics (vancomycin plus ceftazidime) and urgent ophthalmology for intravitreal antibiotics; admit","Topical antibiotics and discharge","Topical steroid only","Patch"],
 sw:"Ophthalmologist must admit for parenteral and possibly intravitreal antibiotics. Cover Bacillus, enterococcus and Staphylococcus spp.",
 p:"Anterior uveitis: cells/flare, limbal injection; check IOP first, prednisolone acetate 1%, cycloplegia; hypopyon patients are generally admitted."},
{c:"Red Eye",l:2,v:"8-year-old: eyelid swelling, redness, fever, ill appearance, painful limited eye movement, proptosis, blurred vision.",
 d:["Orbital cellulitis","Preseptal (periorbital) cellulitis","Hordeolum","Viral conjunctivitis"],
 dw:"Orbital cellulitis: differentiated from periorbital cellulitis by fever, ill appearance, blurred vision, proptosis, painful or limited ocular movement, diplopia, optic disc edema.",
 s:["Measure IOP, blood cultures, IV antibiotics (vancomycin plus ceftriaxone/cefotaxime, add metronidazole for anaerobes), CT orbits and sinuses, admit","Oral antibiotics and discharge","Warm compresses","Topical drops"],
 sw:"Admit all cases of orbital cellulitis. CT axial and coronal of orbits/sinuses to look for foreign body, retrobulbar abscess, orbital gas, subperiosteal abscess, osteomyelitis; consider LP if cavernous sinus changes.",
 p:"Periorbital cellulitis lacks the other findings; PO antibiotics may be used, with ophthalmology reevaluation next day."},
{c:"Red Eye",l:1,v:"30M with a tender red pimple at the margin of the eyelid, pointing externally.",
 d:["Hordeolum (stye)","Chalazion","Blepharitis","Dacryocystitis"],
 dw:"Abscess in eyelash follicle or modified sebaceous gland at the lid margin (external or internal).",
 s:["Warm compresses 15 min four times daily; anti-Staph ointment if needed; PO antibiotics only for internal stye","Incision and drainage","IV antibiotics","Emergent ophthalmology"],
 sw:"Outpatient referral only if treatment failure after 2 weeks. Chalazion: painless meibomian gland nodule, same warm compress care.",
 p:"Blepharitis: inflamed lid margins with crusts on awakening; scrub lids with mild shampoo."},
{c:"Red Eye",l:2,v:"2-week-old neonate: bilateral red eyes with purulent discharge.",
 d:["Chlamydia or gonococcal conjunctivitis","Viral conjunctivitis","Allergic conjunctivitis","Blepharitis"],
 dw:"Conjunctival injection in a neonate under 15 days: chlamydia/gonorrhea (hyperpurulent discharge) on Fig 18.11; neonates are at risk for vision loss or systemic sepsis.",
 s:["Culture drainage, ophthalmology consult, empiric azithromycin for chlamydia and ceftriaxone for suspected gonorrhea","Artificial tears","Naphazoline drops","Reassurance"],
 sw:"Adults: oral azithromycin 3 days for chlamydia; consider ceftriaxone for concurrent N. gonorrhoeae. Neisseria gonorrhoeae can be rapidly sight-threatening.",
 p:"Bacterial conjunctivitis: purulent unilateral; topical polymyxin/trimethoprim in children, sulfacetamide or gentamicin in adults."},
{c:"Red Eye",l:1,v:"20M with bilateral watery red eyes, follicles on the lower lid, sore throat and rhinorrhea. Child at home had it.",
 d:["Viral conjunctivitis","Bacterial conjunctivitis","Allergic conjunctivitis","Herpetic keratitis"],
 dw:"Fig 18.11: mucoid/bilateral discharge with URTI symptoms or lower-lid follicles = viral conjunctivitis; symptomatic relief.",
 s:["Symptomatic relief (artificial tears/naphazoline); counsel on contagion; no antibiotics or steroids","Topical antibiotics","Topical steroids","Ophthalmology tonight"],
 sw:"Viruses shed for 2 weeks; there is no medical reason to exclude from daycare/school unless immunocompromised contacts. Antibiotic misuse is widespread. Steroids can prolong viral infection.",
 p:"Allergic: itchy, bilateral chemosis, seasonal rhinitis; antihistamine drops."},
{c:"Red Eye",l:2,v:"50F: progressively increasing deep eye pain radiating to the face, decreasing vision, photophobia, pain with eye movement. Violaceous injection.",
 d:["Scleritis","Episcleritis","Bacterial conjunctivitis","Pinguecula"],
 dw:"Table 18.1 #20: progressively increasing pain radiating to ipsilateral face, decreasing vision, photophobia, pain with eye motion.",
 s:["Oral NSAIDs and ophthalmology discussion of steroids, re-evaluate in 2-3 days","Reassurance, artificial tears only","Topical antibiotics","Patch"],
 sw:"Episcleritis: rapid onset localized pain with injected episcleral vessels and localized tenderness; artificial tears, PO NSAIDs, outpatient referral if failure after 2 weeks.",
 p:"Rapid-onset localized pain = episcleritis; deep boring pain with vision decrease = scleritis."},
{c:"Red Eye",l:2,v:"60F: tearing and tender swelling of the lower lid beside the nose, with pus expressed from the punctum.",
 d:["Dacryocystitis","Hordeolum","Blepharitis","Orbital cellulitis"],
 dw:"Table 18.1 #13: eye tearing and inflammation of lower eyelid inferior to the lacrimal punctum, redness and tenderness over nasal aspect.",
 s:["Rule out orbital and periorbital cellulitis, PO antibiotics (amoxicillin/clavulanate), warm compresses and massage inner canthus","Incision and drainage","IV vancomycin and admission always","Reassure"],
 sw:"Ophthalmologist may admit if systemically ill, moderate or severe, or no social support. Culture before prescribing if admitting.",
 p:"Pinguecula/pterygium: yellow limbal patches or firmer white nodules extending onto the cornea; naphazoline or ketorolac drops."},

{c:"Sore Throat",l:3,v:"4-year-old with fever, drooling, muffled voice, sniffing position, stridor and hypoxia.",
 d:["Epiglottitis or deep neck infection with airway compromise","Group A strep pharyngitis","Viral pharyngitis","Croup"],
 dw:"Fig 19.5: stridor, drooling, muffled voice, sniffing position, hypoxia = signs of airway compromise. Stridor is a sign of a true airway emergency.",
 s:["Prepare for surgical airway, keep upright, IV/O2/monitor, empiric steroids and antibiotics, ENT/anesthesia/surgery at bedside","Throat swab and RADT now","Sedate for exam","Lay supine for imaging"],
 sw:"Maintain upright position. Severe hypoxia or imminent decompensation: advanced airway using difficult airway algorithm. Prepare for emergent cricothyrotomy before visualizing.",
 p:"Critical: neck hematoma, epiglottitis, retropharyngeal/parapharyngeal/peritonsillar abscess with airway compromise, Ludwig angina, angioedema, croup with stridor at rest, Lemierre, ACS with referred pain."},
{c:"Sore Throat",l:2,v:"22M: sore throat with fever, tonsillar exudates, tender anterior cervical nodes, no cough.",
 d:["Group A streptococcal pharyngitis (Centor score 4)","Viral pharyngitis","Peritonsillar abscess","Infectious mononucleosis only"],
 dw:"Modified Centor (McIsaac): fever, tonsillar exudates, tender cervical LAD, absence of cough, age 3-14 +1, age >45 -1. Score 4-5 gives >50% GABHS.",
 s:["Rapid antigen detection test (RADT) and treat if positive; culture only in children/adolescents with negative RADT","Antibiotics without testing","Throat culture for all adults","No testing and no treatment"],
 sw:"RADT specificity is 95%, so a positive requires no confirmation. Adults with Centor 0-2 should not be tested. Positive: IM penicillin G or oral regimens; NSAIDs/acetaminophen for pain.",
 p:"Score 0 or -1: 5-10% GAS; score 1: 10-15%; 2: 20-30%; 3: 33%; 4+: >50%."},
{c:"Sore Throat",l:2,v:"25M: severe unilateral throat pain, muffled voice, trismus, uvula deviated to the opposite side, unilateral tonsillar swelling.",
 d:["Peritonsillar abscess","Group A strep pharyngitis","Viral pharyngitis","Epiglottitis"],
 dw:"Unilateral swelling and contralateral uvular deviation suggest peritonsillar abscess; typically no exudates present.",
 s:["Analgesia for exam, assess airway; needle aspiration/drainage, antibiotics, ENT; consider imaging for extent","Oral amoxicillin and discharge","Observation","Antihistamines"],
 sw:"Peritonsillar abscess can cause airway compromise. Lemierre syndrome can complicate pharyngitis or PTA.",
 p:"Patients with trismus should receive analgesia to allow complete visualization."},
{c:"Sore Throat",l:3,v:"20M with recent pharyngitis: fever, neck pain and swelling, rigors, pleuritic chest pain, nodular lung opacities.",
 d:["Lemierre syndrome (septic internal jugular thrombophlebitis)","Viral pharyngitis","Peritonsillar abscess only","Kawasaki disease"],
 dw:"Lemierre complicates pharyngitis or PTA, affects ipsilateral internal jugular vein; sore throat, fever, neck pain, arthralgias and pulmonary symptoms from septic emboli.",
 s:["Imaging of neck (CT with contrast), blood cultures, IV antibiotics, admit","Oral antibiotics","NSAIDs","Discharge"],
 sw:"Other complications of untreated GAS: suppurative (peritonsillar abscess, cervical lymphadenitis, mastoiditis) and nonsuppurative (acute rheumatic fever).",
 p:"Kawasaki: fever more than 5-7 days in children, cervical LAD in about 50%."},
{c:"Sore Throat",l:1,v:"28F with sore throat, cough, rhinorrhea, hoarseness, conjunctivitis and oral ulcers.",
 d:["Viral pharyngitis","Group A strep pharyngitis","Peritonsillar abscess","Epiglottitis"],
 dw:"Clear viral etiology (oral ulcers, cough, rhinorrhea, hoarseness) makes GAS unlikely; no testing or treatment.",
 s:["Symptomatic care: NSAIDs or acetaminophen, hydration; explain why antibiotics are not needed","RADT and antibiotics","Throat culture","IM penicillin"],
 sw:"IDSA does not recommend RADT or antimicrobial treatment with features strongly suggesting a viral cause. Consider dexamethasone 0.6 mg/kg (max 10 mg) once for severe pain or dysphagia in patients older than 5 years.",
 p:"Pain needing opioids should prompt evaluation for a more severe cause (abscess or epiglottitis)."},
{c:"Sore Throat",l:2,v:"19M with sore throat, fever, severe fatigue, posterior cervical nodes, splenomegaly. RADT negative.",
 d:["Infectious mononucleosis","Group A strep pharyngitis","Peritonsillar abscess","Diphtheria"],
 dw:"Gonococcal infection and mononucleosis should be considered when pharyngitis is prolonged or unusual; heterophile antibody test helps.",
 s:["Heterophile antibody testing and advice regarding contagiousness and activity limitation","Empiric penicillin","IV steroids and admit","Tonsillectomy"],
 sw:"Consider additional tests (acute retroviral syndrome etc.) in patients with prolonged course, unusual features or treatment failure.",
 p:"Periodic fevers with aphthous stomatitis, pharyngitis, adenitis (PFAPA) recur every 3-6 weeks."},

{c:"Hemoptysis",l:1,v:"32M: scant blood-streaked sputum for 1 day with a classic viral bronchitis story, normal vitals, no risk factors.",
 d:["Trace hemoptysis from viral bronchitis","Massive hemoptysis","Pulmonary embolism","Tracheo-innominate fistula"],
 dw:"Trace hemoptysis/blood-tinged sputum with a classic story for viral bronchitis does not require laboratory or radiologic investigation.",
 s:["Discharge home with follow-up (Fig 20.1)","CT chest with contrast","Bronchoscopy","Admit to ICU"],
 sw:"Single episode of blood-tinged sputum with normal BP, no cancer history and normal chest x-ray could be safely discharged.",
 p:"For all others the initial screening test is a chest x-ray."},
{c:"Hemoptysis",l:2,v:"60M with vomit-like dark material mixed with food after retching, acidic pH. Patient reports vomiting, not coughing.",
 d:["Hematemesis (GI source) mimicking hemoptysis","Pulmonary hemoptysis","Epistaxis","Tracheal-arterial fistula"],
 dw:"Distinguish hemoptysis from hematemesis by history (coughing vs vomiting); gastric blood is fragmented and dark (coffee-ground), while pulmonary blood is bright red and frothy; pH testing helps.",
 s:["Redirect the work-up to a GI source; inspect nasopharynx and oral cavity to exclude other sources","Bronchoscopy","HRCT chest","Tranexamic acid inhaled"],
 sw:"Nasal, oral or hypopharyngeal bleeding may contaminate the tracheobronchial tree and mimic true hemoptysis.",
 p:"Inspection and pH testing may distinguish GI from tracheobronchial hemorrhage."},
{c:"Hemoptysis",l:3,v:"70M, 400 mL of blood coughed in a few hours, SpO2 86%, BP 88/50. Known right lung cavity.",
 d:["Massive hemoptysis with hemodynamic instability and hypoxia","Trace hemoptysis","Pulmonary embolism","Hematemesis"],
 dw:"Massive hemoptysis: most lethal sequela is hypoxia from V/Q mismatch as alveoli fill with blood.",
 s:["Bleeding lung-down positioning, two large-bore IVs, IVF/blood, FFP, monitor, intubate with large ETT (8.0), consult CT surgery/pulm/IR","Order outpatient CT","Antitussives only","Observe on ward"],
 sw:"Fig 20.2: bleeding lung-down so the unaffected lung is protected. If intubation needed use shock-sensitive strategy (isotonic fluids/blood, reduced induction dose, pressors such as norepinephrine). Select right-mainstem intubation for left-sided bleed when needed.",
 p:"Emergency thoracotomy in OR is reserved for life-threatening hemoptysis uncontrolled by bronchoscopy; hemostatic rates 85-98% but 20-50% rebleed early."},
{c:"Hemoptysis",l:3,v:"55F with a tracheostomy: sudden brisk bright red bleeding from the tracheostomy.",
 d:["Tracheo-innominate artery fistula (TIF)","Aortobronchial fistula","Trace hemoptysis","Pulmonary embolism"],
 dw:"Box 20.2: tracheo-innominate artery fistula is a critical diagnosis needing immediate hemorrhage control.",
 s:["Overinflate the trach cuff; if that fails, remove tube, orotracheally intubate, and place index finger through the stoma to compress the artery; call surgery","Bronchoscopy","CT then decide","Tranexamic acid only"],
 sw:"Fig 20.3: finger through the tracheostomy hole occluding the tracheo-innominate artery. Aortobronchial fistulae are highly lethal; consult endovascular surgeon early.",
 p:"Critical hemoptysis diagnoses: DIC, TIF, aortobronchial fistula, iatrogenic hemoptysis, PE."},
{c:"Hemoptysis",l:2,v:"58M on warfarin with INR 6.5: significant hemoptysis, hemodynamically borderline.",
 d:["Coagulopathy-related hemoptysis (anticoagulant overdose)","Pulmonary embolism","Bronchiectasis","Endocarditis"],
 dw:"Box 20.2 emergent: oral anticoagulant overdose; any episode of hemoptysis can be exacerbated by coagulopathy and thrombocytopenia.",
 s:["Reverse coagulopathy: 2-4 units FFP and 10 mg IV vitamin K (PCC has been used); consider tranexamic acid","Observe without reversal","Give more anticoagulant","Bronchoscopy first"],
 sw:"Thrombocytopenia: platelet transfusion with a goal of 50,000-60,000. TXA reduced severity of bleeding in a pilot RCT of submassive hemoptysis.",
 p:"DIC with bleeding and platelets <50,000: transfuse; FFP and cryoprecipitate replace consumed factors."},
{c:"Hemoptysis",l:2,v:"45M, hemodynamically stable, moderate hemoptysis. Chest x-ray is non-diagnostic.",
 d:["Undifferentiated hemoptysis requiring advanced imaging","Trace hemoptysis","Hematemesis","Resolved bronchitis"],
 dw:"Chest x-ray is limited in hemoptysis, often cannot identify the bleeding source.",
 s:["Chest CT with contrast / HRCT; bronchoscopy if CT non-diagnostic; pulmonary/thoracic input","Discharge","Outpatient chest x-ray repeat","Angiography first"],
 sw:"HRCT is diagnostically comparable to angiography, less invasive and more available, and more accurate than bronchoscopy in locating bleeding. Angiography is first-line when bleeding is known to be from the bronchial artery or an intervention is planned; embolization success up to 95%.",
 p:"Initial lab tests: CBC, PT/INR, type and screen, consider BNP, D-dimer, troponin."},

{c:"Dyspnea",l:3,v:"28M after a stab wound to the right chest: severe dyspnea, hypotension, tracheal deviation, JVD, absent breath sounds on the right.",
 d:["Tension pneumothorax","Simple pneumothorax","Cardiac tamponade","Pulmonary embolism"],
 dw:"Table 21.3 tension: JVD, tracheal deviation, muffled heart sounds and cardiovascular collapse due to obstructive shock; Table 21.2: hypotension with tension pneumothorax.",
 s:["Immediate chest decompression (needle or finger/tube thoracostomy); clinical diagnosis, do not wait for imaging","CXR first","Intubate and then image","Pericardiocentesis"],
 sw:"Fig 21.1: unequal breath sounds with hypotension, shock, tracheal deviation or JVD, or ultrasound evidence of ptx -> immediate chest decompression. Fig 21.2: tension pneumothorax: needle decompression or tube thoracostomy.",
 p:"Simple pneumothorax is emergent; ultrasound shows loss of lung sliding."},
{c:"Dyspnea",l:2,v:"68M: worsening orthopnea and PND, bilateral edema, JVD, S3, rales. BNP elevated; CXR shows interstitial edema and Kerley B lines.",
 d:["Acute pulmonary edema (CHF / fluid overload)","COPD exacerbation","Pulmonary embolism","Pneumonia"],
 dw:"Table 21.3 fluid overload: worsening orthopnea, PND, JVD, peripheral edema, S3/S4, hepatojugular reflux; CXR pleural effusion, interstitial edema, Kerley B lines, cardiomegaly; BNP.",
 s:["Diuretics, nitrates, ACE inhibitors, morphine; consider CPAP/BiPAP; obtain ECG","Bronchodilators and steroids","Antibiotics and cultures","Anticoagulate"],
 sw:"Fig 21.1: +BNP and interstitial pattern on CXR -> consider pulmonary edema; ECG; treat with diuretics, nitrates, ACE inhibitors, morphine, CPAP or BiPAP.",
 p:"Echo/bedside ultrasound: B lines, cardiomegaly, pleural effusion."},
{c:"Dyspnea",l:2,v:"24F: wheezing, air hunger and chest tightness after a URI. Accessory muscle use, tripoding, sharkfin capnography waveform. Clear CXR.",
 d:["Asthma or COPD exacerbation (bronchospasm)","Congestive heart failure","Pulmonary embolism","Pneumothorax"],
 dw:"Table 21.3: retractions, accessory muscle use, tripoding, cyanosis, and a shark fin capnograph waveform in asthma/COPD.",
 s:["Inhaled beta-agonist, IV steroids, consider other adrenergics, treat concurrent infection","Diuretics","Anticoagulation","Antibiotics only"],
 sw:"Fig 21.2: asthma/COPD exacerbation: 1 inhaled beta-agonist, 2 steroids IV, 3 consider other adrenergics, 4 treat infection, 5 counsel smoking cessation. Fig 21.1: wheezes, clear CXR, consider anaphylaxis, bronchospasm; bronchodilators, epinephrine, steroids, antihistamines.",
 p:"Waveform capnography is useful to assess ventilation and the underlying cause."},
{c:"Dyspnea",l:3,v:"35F on oral contraceptives and smoking: abrupt-onset dyspnea and pleuritic chest pain, unilateral leg swelling, tachycardia, low-grade fever, S1Q3T3 on ECG.",
 d:["Pulmonary embolism","Pneumonia","Pneumothorax","Asthma exacerbation"],
 dw:"Table 21.3 PE: abrupt onset, pleuritic chest pain, immobility, hormonal therapy, tobacco; tachycardia, tachypnea, low-grade fever; ECG right heart strain.",
 s:["Anticoagulate (heparin, apixaban or rivaroxaban); diagnostic imaging (CTA, V/Q); consider systemic thrombolysis if unstable","Antibiotics","Bronchodilators","Diuretics"],
 sw:"Fig 21.2: PE: initiate anticoagulation (IV heparin, apixaban, rivaroxaban, or SC LMWH); 2 consider systemic thrombolysis if unstable; 3 consider interventional clot lysis with pulmonary angiography.",
 p:"D-dimer: abnormal clotting activity. Westermark sign, Hampton hump on CXR."},
{c:"Dyspnea",l:3,v:"40M after a bee sting: sudden dyspnea, oral swelling, stridor, wheezing, hives, abdominal pain.",
 d:["Anaphylaxis","Asthma exacerbation","Pulmonary embolism","Pneumothorax"],
 dw:"Table 21.3 anaphylaxis: abrupt onset, exposure to allergen; oral swelling, stridor, wheezing, hives, pruritus, abdominal pain, nausea.",
 s:["Secure airway if needed; epinephrine IM (IV if extreme); steroids, diphenhydramine, inhaled beta-agonist, H1/H2 blockers","Steroids alone and observe","Antibiotics","CT chest"],
 sw:"Fig 21.2 anaphylaxis: secure airway when needed (intubation/cricothyrotomy), epinephrine IV (extreme)/IM, steroids IV, diphenhydramine IV, inhaled beta-agonist, racemic epinephrine, H1/H2 blocker.",
 p:"Airway obstruction is a critical diagnosis; stridor and drooling suggest upper airway obstruction."},
{c:"Dyspnea",l:2,v:"55M after a car crash with steering-wheel impact: dyspnea, paradoxical movement of a chest wall segment, rib pain, subcutaneous emphysema, hypoxia.",
 d:["Flail chest with pulmonary contusion","Simple rib fracture","Tension pneumothorax","Pericarditis"],
 dw:"Table 21.2: flail segment = flail chest, pulmonary contusion; crepitus/subcutaneous emphysema = pneumothorax or tracheobronchial rupture.",
 s:["FAST/ultrasound, CXR, analgesia (pain control), oxygen and early ventilatory support if failing","Discharge with oral analgesics","Antibiotics","Anticoagulation"],
 sw:"Fig 21.2 trauma: pulmonary contusion/multiple rib fractures: pain management; tension pneumothorax: immediate decompression; inhalation injury: early intubation.",
 p:"Thoracoabdominal dyssynchrony: diaphragmatic injury or cervical spinal cord trauma."},
{c:"Dyspnea",l:3,v:"45F in a winter house fire with headache and dyspnea; normal SpO2 reading, but pulse oximeter is misleading. Elevated carboxyhemoglobin on co-oximetry.",
 d:["Carbon monoxide poisoning or inhalation injury","Pneumonia","Asthma","Pulmonary embolism"],
 dw:"Table 21.1 hematologic critical: carbon monoxide or cyanide poisoning; Table 21.4: elevated carboxyhemoglobin (inhalation injury or CO poisoning).",
 s:["100% oxygen, co-oximetry, consider early intubation for inhalation injury; cyanide considered","Bronchodilators and discharge","Antibiotics","Observe on room air"],
 sw:"Early endotracheal intubation for inhalation injury (Fig 21.2). Also consider acute chest syndrome in sickle cell.",
 p:"Pulse oximetry cannot detect carboxyhemoglobin."},
{c:"Dyspnea",l:2,v:"78F smoker: fever, productive cough, dyspnea and pleuritic chest pain, rhonchi, no leg swelling, focal infiltrate on CXR.",
 d:["Pneumonia","Congestive heart failure","Pulmonary embolism","Tension pneumothorax"],
 dw:"Table 21.3 pneumonia: fever, productive cough, chest pain; tachycardia, tachypnea, rales or decreased breath sounds; CXR, CBC, cultures.",
 s:["Antibiotics and blood cultures (CAP score decides admission); oxygen; isolation if indicated","Diuretics","Anticoagulation","Needle decompression"],
 sw:"Fig 21.1: rhonchi, diminished breath sounds, infiltrate on CXR -> pneumonia, pleural effusion: antibiotics, blood cultures. Pneumonia CAP >70 is emergent; <=70 nonemergent.",
 p:"Procalcitonin correlates with CAP pathogens but routine use to guide antibiotics is not recommended."},
{c:"Dyspnea",l:2,v:"34F: ascending weakness, hyporeflexia, shortness of breath and weak cough, normal lungs.",
 d:["Guillain-Barre syndrome with respiratory muscle weakness","Pulmonary embolism","Asthma","Pneumonia"],
 dw:"Table 21.2: ascending weakness = GBS; neuromuscular disease causes dyspnea with decreased respiratory effort (Table 21.1).",
 s:["Monitor respiratory function (NIF, vital capacity), ready for intubation, ICU and neurology","Discharge","Bronchodilators","Antibiotics"],
 sw:"Neuromuscular causes (GBS, tick paralysis, MS) present with decreased respiratory effort; look for hypercarbia on VBG/capnography.",
 p:"Hypermagnesemia causes hyporeflexia; hypoK, hypoMg, hypoPhos cause diffuse weakness."},

{c:"Chest Pain",l:3,v:"58M: crushing substernal chest pressure radiating to the left arm and jaw with diaphoresis, ST elevation >1 mm in contiguous leads.",
 d:["Acute myocardial infarction (STEMI)","Pericarditis","Aortic dissection","Pulmonary embolism"],
 dw:"Table 22.2/22.5: severe, crushing, exertional pain radiating to jaw, neck, shoulder, arm = acute MI; ST elevation >1 mm in contiguous leads or new LBBB.",
 s:["Aspirin, nitroglycerin, heparin; immediate reperfusion (PCI or fibrinolysis with P2Y12 inhibitor)","Observe and repeat troponin","CT angiography first","Discharge"],
 sw:"Fig 22.2: STEMI: heparin or LMWH, IV nitroglycerin, consider beta blocker, revascularization with fibrinolysis or P2Y12 inhibitor + PCI. ECG within 10 minutes.",
 p:"Troponin sensitivity for MI at 4 h is about 50%, nearly 100% by 12 h. Do not wait for troponin in STEMI."},
{c:"Chest Pain",l:3,v:"62M with hypertension: abrupt tearing chest pain radiating to the back, maximal at onset, BP 190/100 right arm and 140/80 left arm, wide mediastinum on CXR.",
 d:["Aortic dissection","Acute MI","Pulmonary embolism","Esophageal rupture"],
 dw:"Tearing severe pain radiating to back, maximum at onset; significant difference in upper-extremity BP, wide mediastinum. 90% rapid-onset severe pain; median age 59; HTN in 70-90%.",
 s:["Immediate BP/HR control and CT angiography (or TEE/MRI); surgical consult; avoid anticoagulation until excluded","Aspirin, heparin and PCI","D-dimer and observe","Discharge"],
 sw:"Patients with pain, signs of dissection and significant hypertension are candidates for immediate reduction of blood pressure. Selection of imaging depends on clinical status and test availability.",
 p:"ECG can be normal or show nonspecific changes. Dissection into coronary arteries (usually right) can mimic MI, so a dissection can be missed by giving anticoagulation."},
{c:"Chest Pain",l:3,v:"28M, tall, thin: sudden pleuritic chest pain and dyspnea, hypotension, absent breath sounds on the right, shock and JVD.",
 d:["Tension pneumothorax","Acute MI","Aortic dissection","Pericarditis"],
 dw:"Fig 22.1: absent breath sounds with shock = tension pneumothorax; hypoxemia, hypotension, tachycardia.",
 s:["Immediate decompression; do not wait for CXR","ECG and troponin","CT chest","Aspirin"],
 sw:"Tension pneumothorax is critical; ECG/CXR follow decompression. Risk factors: prior pneumothorax, Valsalva, chronic lung disease, smoking.",
 p:"Pneumothorax with mediastinal shift on CXR = tension."},
{c:"Chest Pain",l:3,v:"45M after forceful vomiting: severe chest pain, subcutaneous emphysema, Hamman crunch, fever. CXR shows pneumomediastinum and left pleural effusion.",
 d:["Esophageal rupture (Boerhaave syndrome)","Acute MI","Pneumothorax","Pericarditis"],
 dw:"Table 22.4: pneumomediastinum and effusion on CXR = esophageal rupture or mediastinitis; Hamman sign (systolic crunch) in rupture/mediastinitis. Table 22.1: critical GI diagnosis.",
 s:["CT with contrast (esophageal wall edema, pneumomediastinum, periesophageal fluid), NPO, broad-spectrum antibiotics, urgent surgery/GI consult","Aspirin and heparin","Antacids and discharge","Endoscopy without CT"],
 sw:"Fluid level may be seen in esophageal rupture on CXR; pleural effusion, subcutaneous air, mediastinal air. Fever is common.",
 p:"Mallory-Weiss (esophageal tear) is an emergent diagnosis; nausea and vomiting association."},
{c:"Chest Pain",l:2,v:"26M: sharp pleuritic chest pain relieved by leaning forward after a viral illness, pericardial friction rub, diffuse ST elevation with PR depression.",
 d:["Pericarditis","Acute MI","Aortic dissection","Pneumothorax"],
 dw:"Table 22.5: pericarditis = diffuse ST elevation and PR depression; pericardial rub on exam; pleuritic pain.",
 s:["Bedside ultrasound for effusion and treat with NSAIDs; ECG; admit/observe if effusion or high-risk features","Fibrinolysis","Cath lab activation","Heparin infusion"],
 sw:"POCUS evaluates pericardial effusion/tamponade. Low voltage, diffuse ST elevation, electrical alternans in tamponade. Narrow pulse pressure, hypotension, JVD, muffled sounds suggest tamponade.",
 p:"Risk factors: infection, autoimmune (SLE), recent MI or cardiac surgery, malignancy, uremia, drugs."},
{c:"Chest Pain",l:3,v:"55M with pericarditis history now hypotensive with narrow pulse pressure, JVD, muffled heart sounds and electrical alternans.",
 d:["Cardiac tamponade","Acute MI","Tension pneumothorax","Aortic dissection"],
 dw:"Beck-type picture: narrow pulse pressure, JVD, muffled heart tones, electrical alternans; pericardial fluid on bedside ultrasound.",
 s:["Bedside cardiac ultrasound and emergent pericardiocentesis/surgical drainage","Nitroglycerin","Diuretics","Beta blocker"],
 sw:"Patients with low-voltage ECG, diffuse ST elevation, JVD and signs of shock should undergo prompt bedside cardiac ultrasound for tamponade.",
 p:"Large pericardial effusion plus shock = tamponade; avoid vasodilators and diuretics."},
{c:"Chest Pain",l:3,v:"64F: chest pressure at rest for 25 minutes now resolved, T-wave inversion >2 mm, intermediate troponin elevation, no ST elevation.",
 d:["Intermediate-risk NSTE-ACS (unstable angina/NSTEMI)","STEMI","Pericarditis","Pulmonary embolism"],
 dw:"Fig 22.2 intermediate risk: >10 min rest pain, resolved; T wave inversion >2 mm; intermediate troponin elevation.",
 s:["Ischemia-guided strategy: observation bed, P2Y12 inhibitor, heparin/LMWH, IV nitroglycerin, beta blocker, serial ECGs and markers","Discharge with follow-up","Immediate fibrinolysis","Reassure"],
 sw:"High risk (elevated troponin, new ST depression 0.5 mm, recurrent ischemia, hemodynamic instability, prior PCI in last 6 months or CABG) gets early invasive treatment with diagnostic catheterization in 12 to 48 hours. Ongoing ischemia converts to early invasive.",
 p:"Low risk: nondiagnostic ECG and markers, age <70: ED chest pain center / provocative testing, then discharge."},
{c:"Chest Pain",l:2,v:"45F on oral contraceptives, smoking: pleuritic chest pain, tachycardia, hypoxemia, unilateral leg swelling, hemoptysis.",
 d:["Pulmonary embolism","Pericarditis","Pneumothorax","Esophageal reflux"],
 dw:"Table 22.2: associated hemoptysis = PE; Box 22.1 risk factors: OCP with smoking, prolonged immobilization, DVT. Pleural rub, unilateral leg swelling.",
 s:["Risk stratify: D-dimer if low pretest; CT angiography if high; start anticoagulation before imaging if high pretest probability and no contraindication","Aspirin and discharge","Antacid","Reassure"],
 sw:"A low D-dimer in a patient without high pretest probability excludes PE. High pretest probability warrants initiating anticoagulation (heparin/LMWH or DOAC) before imaging.",
 p:"ECG right-ventricular strain (S1Q3T3) raises suspicion for PE; V/Q scan high probability positive."},
{c:"Chest Pain",l:2,v:"50M with chest wall tenderness reproduced on palpation, normal ECG, normal vitals, sharp pain with movement.",
 d:["Musculoskeletal chest wall pain (diagnosis of exclusion)","Acute MI","Aortic dissection","Pulmonary embolism"],
 dw:"Musculoskeletal causes (muscle strain, rib fracture, costochondritis) are nonemergent; however, a nonspecific chest wall pain diagnosis must follow exclusion of critical causes.",
 s:["Complete ECG (within 10 min) and risk review; if low risk, analgesia and outpatient follow-up","Heparin","CT angiography","Admit to CCU"],
 sw:"Any patient with almost any type of chest pain may be having ischemia, PE or dissection. Diaphoresis points away from chest wall.",
 p:"Pain localized to a small area is more somatic; localized at the chest periphery is more likely pulmonary."},
{c:"Chest Pain",l:1,v:"20M with sudden sharp chest pain only on deep breaths and movement, normal ECG, no risk factors, reproducible on palpation, vitals normal.",
 d:["Pleuritic/musculoskeletal pain with low risk","Aortic dissection","STEMI","Tension pneumothorax"],
 dw:"Sharp or stabbing pain is seen more in pulmonary and musculoskeletal diagnoses; pain worsened by respiration suggests pulmonary, pericardial or musculoskeletal causes.",
 s:["ECG and CXR; if both normal and low risk, reassure and NSAIDs with follow-up","Immediate CT angiography","Aspirin and heparin","Admit"],
 sw:"ECG and CXR are the two most commonly performed studies in chest pain; ECG ideally within 10 minutes of arrival.",
 p:"Pain lasting seconds is rarely cardiac origin."},

/* ===== Batch 5: Ch23-31 ===== */
{c:"Abdominal Pain",l:3,v:"26F, missed period 7 weeks, sudden severe left lower abdominal pain, lightheaded. BP 84/50, HR 124, adnexal tenderness, positive urine hCG.",
 d:["Ruptured ectopic pregnancy","Appendicitis","Uncomplicated ovarian cyst","Pelvic inflammatory disease"],
 dw:"Table 23.1: ectopic occurs in females of childbearing age with severe, sharp, constant lateralized pain; shock or peritonitis may be present. Positive hCG plus instability is ruptured ectopic until proven otherwise.",
 s:["Large-bore IV, volume and blood, bedside ultrasound/FAST for free fluid, STAT gynecology","CT abdomen and pelvis first","Analgesia and repeat hCG in 48 h","Outpatient methotrexate"],
 sw:"Fig 23.5: signs of shock -> IV access and bedside ultrasound for free fluid, then OB-GYN consultation. Unstable patients do not go to CT.",
 p:"Vaginal bleeding does not have to be present. Assisted reproduction patients are not ruled out for ectopic even when an IUP is seen (heterotopic pregnancy)."},
{c:"Abdominal Pain",l:3,v:"72M, hypertensive smoker, sudden severe epigastric and back pain then near-syncope. BP 82/50, pulsatile abdominal mass, unequal femoral pulses.",
 d:["Ruptured abdominal aortic aneurysm","Pancreatitis","Renal colic","Perforated ulcer"],
 dw:"Table 23.1: ruptured AAA = epigastric and back pain with syncope or shock; pulsatile mass in aneurysms 5 cm or greater; femoral pulse inequality or bruits.",
 s:["Bedside ultrasound/FAST and emergent surgical or vascular consultation; permissive hypotension","Abdominal plain film","Discharge with outpatient CT","Aggressive antihypertensives"],
 sw:"Unstable patients with suspected AAA need emergent surgical consultation based on exam or ultrasound, often alongside imaging. CT-A is the test of choice only in stable patients. Permissive hypotension is allowable.",
 p:"Vital signs may be normal in 70%. Endovascular repair is possible, even in some complex cases."},
{c:"Abdominal Pain",l:3,v:"76M with atrial fibrillation: 6 hours of severe periumbilical colicky pain, vomiting and diarrhea. Abdomen soft, minimally tender, bowel sounds present. Lactate high, WBC high.",
 d:["Acute mesenteric ischemia","Gastroenteritis","Diverticulitis","Constipation"],
 dw:"Table 23.1: elders with CV disease; pain out of proportion to examination, early exam can be remarkably benign, bowel sounds often present; arterial occlusion 65% (75% emboli). Leukocytosis and lactic acidosis.",
 s:["CT angiography, surgical and interventional radiology consultation, early","Antiemetics and oral hydration","Abdominal ultrasound only","Discharge with serial exams in 1 week"],
 sw:"CT-A is now the test of choice (traditional angiography allows therapy too). Needs a multidisciplinary approach; interventional approaches usually first unless frank peritonitis. Mortality about 70%.",
 p:"Pain out of proportion to examination = mesenteric ischemia. Diarrhea and vomiting can mislead toward gastroenteritis."},
{c:"Abdominal Pain",l:3,v:"61M on chronic NSAIDs: sudden epigastric pain, vomiting, low-grade fever. Abdomen board-like with diffuse guarding and rebound, absent bowel sounds.",
 d:["Perforated viscus (perforated peptic ulcer)","Biliary colic","Gastroenteritis","Pancreatitis"],
 dw:"Table 23.1: acute epigastric pain with spillage of bowel contents causing peritonitis; guarding and rebound, board-like abdomen later; decreased bowel sounds.",
 s:["Upright chest x-ray or CT for free air, IV fluids and antibiotics, surgical consultation","Antacid trial and discharge","Oral contrast study first","Observe for 24 hours"],
 sw:"Fig 23.5: concern for peritonitis -> upright CXR or expedited CT with surgical consultation. Upright film shows free air in 70-80% of perforated ulcers.",
 p:"Elders rarely have rigidity (absent in almost 90%), so do not wait for a board-like abdomen."},
{c:"Abdominal Pain",l:2,v:"68F with diabetes and hypertension: epigastric discomfort, nausea, diaphoresis for 1 hour. Abdomen benign, HR 52.",
 d:["Acute myocardial infarction (inferior)","Gastritis","Biliary colic","Pancreatitis"],
 dw:"Table 23.1: AMI in elderly women may present with GI symptoms; nausea, vomiting or epigastric discomfort can be the only symptom, particularly in inferior events; bradycardia often seen with inferior MI.",
 s:["Rapid ECG now; if STEMI, expeditious reperfusion","GI cocktail and observe","Abdominal ultrasound","Lipase and discharge"],
 sw:"Fig 23.5: high-risk for vascular disease (AAA or AMI) -> EKG and expedited CT-A. Rapid ECG whenever coronary ischemia is possible; mortality increases with delays in care.",
 p:"Do not give a GI cocktail before an ECG in older diabetic or female patients."},
{c:"Abdominal Pain",l:2,v:"19M: periumbilical pain that migrated to the right lower quadrant over 12 hours, anorexia, temperature 38C, RLQ tenderness with rebound.",
 d:["Acute appendicitis","Gastroenteritis","Mesenteric adenitis","Constipation"],
 dw:"Table 23.2: epigastric or periumbilical pain migrating to RLQ over 8-12 h, anorexia 80%, low-grade fever; RLQ tenderness 90-95% with rebound.",
 s:["Surgical consultation and imaging (CT; ultrasound in children, thin patients, pregnancy) if diagnosis unclear","Discharge on antiemetics","Barium enema","Rectal exam only and observe"],
 sw:"Fig 23.5: lower abdomen: pelvic exam/US as needed, urinalysis, consider CT for appendicitis if diagnosis unclear. WBC is nonspecific and may be normal.",
 p:"Pain migration +LR 3.2 in adults; later presentations carry higher perforation rates (about 2% mortality with perforation)."},
{c:"Abdominal Pain",l:2,v:"48M with heavy alcohol use: sudden epigastric pain radiating straight through to the back, vomiting, pain out of proportion to exam, mild epigastric tenderness.",
 d:["Acute pancreatitis","Appendicitis","Cholelithiasis only","Diverticulitis"],
 dw:"Table 23.2: acute epigastric pain radiating to the mid-back with nausea and vomiting; pain disproportionate to physical findings; alcohol and gallstones are risk factors.",
 s:["Serum lipase, adequate volume repletion, ultrasound for gallstones, analgesia, antiemetics","Amylase only and discharge","CT of the head","Antibiotics for all patients"],
 sw:"Serum lipase is the test of choice. Ultrasound assesses for gallstones; CT is recommended if severe disease is suspected. Adequate volume repletion is important in the initial therapy.",
 p:"Flank or periumbilical ecchymosis (Grey Turner or Cullen) suggests hemorrhagic pancreatitis."},
{c:"Abdominal Pain",l:1,v:"40F, crampy RUQ pain radiating to the right scapula after a fatty meal, nausea. Afebrile, mild RUQ tenderness, no rebound.",
 d:["Biliary colic (cholelithiasis)","Cholecystitis with perforation","Appendicitis","Pancreatitis"],
 dw:"Table 23.2: crampy RUQ pain radiating to the right subscapular area with nausea or postprandial pain; temperature normal in biliary colic.",
 s:["RUQ ultrasound, LFTs, lipase; analgesia and antiemetic","Emergent cholecystectomy","CT of the pelvis","HIDA scan first"],
 sw:"Fig 23.5 upper abdomen: RUQ ultrasound, EKG, LFTs, lipase; CT if other imaging necessary. Longer pain duration, fever or rebound favors cholecystitis or cholangitis.",
 p:"Risk factors: female, fat, forty, fertile (multiparity, obesity, alcohol, birth control pills)."},
{c:"Abdominal Pain",l:1,v:"34M, abrupt severe right flank pain radiating to the groin, restless and unable to find a comfortable position, vomiting, hematuria on dipstick. Normal vitals.",
 d:["Ureteral colic (renal stone)","Appendicitis","Ruptured AAA","Pyelonephritis"],
 dw:"Table 23.2: acute flank pain radiating to the groin, nausea and pallor; patients are restless; urinalysis usually shows hematuria; vitals usually normal.",
 s:["Urinalysis, noncontrast CT (or ultrasound if stone history known), analgesia and antiemetic","Plain film only","Emergent surgery","Antibiotics alone"],
 sw:"Noncontrast CT is sensitive and specific; ultrasound for hydronephrosis may suffice if diagnosis already established. Remember AAA mimics renal colic in older patients.",
 p:"Peritonitis patients lie still; colic patients writhe."},
{c:"Abdominal Pain",l:2,v:"58M, previous laparotomy: crampy diffuse abdominal pain, repeated vomiting, distension and no flatus. Hyperactive high-pitched bowel sounds.",
 d:["Small bowel obstruction","Gastroenteritis","Constipation","Appendicitis"],
 dw:"Table 23.2: crampy diffuse pain with vomiting; distension, hyperactive bowel sounds; adhesions from prior surgery cause most small bowel obstruction.",
 s:["IV fluids, electrolytes, imaging (CT), NG decompression and early surgical consultation","Laxatives and discharge","Antiemetic and observe","Barium swallow"],
 sw:"Fig 23.5: obstipation, decreased bowel movements, distension -> image for SBO, consider early surgical consultation. Local peritoneal signs may indicate strangulation.",
 p:"Adhesions, hernias and tumors account for 90% of bowel obstructions; check all hernia sites."},
{c:"Abdominal Pain",l:2,v:"66M, LLQ pain, low-grade fever, change in stool frequency, LLQ tenderness without rebound, hemodynamically normal.",
 d:["Diverticulitis","Appendicitis","Ischemic colitis","Ureteral colic"],
 dw:"Table 23.2: LLQ pain with fever, nausea and change in stool habits; low-grade fever, LLQ tenderness without rebound; incidence rises with age.",
 s:["CT is diagnostic; low-risk patients may be diagnosed clinically and treated as outpatients with antibiotics and follow-up","Emergent colectomy","Barium enema","Plain films"],
 sw:"Complications include obstruction, peritonitis, abscesses and fistulae. Admit if immunosuppressed, high-risk or unable to tolerate oral hydration.",
 p:"Left-sided pain in patients over 40 raises diverticulitis and colitis."},
{c:"Abdominal Pain",l:2,v:"52M with undiagnosed severe abdominal pain waiting for surgical evaluation. Pain 9/10, normal vitals, no analgesia given yet because the nurse is waiting for the surgeon.",
 d:["Acute undifferentiated abdominal pain (analgesia should not be withheld)","Functional abdominal pain only","Drug-seeking behavior","Constipation"],
 dw:"Fig 23.6 management algorithm: pain? -> administer pain control (morphine, fentanyl). Analgesia should not be withheld while patients are undergoing further evaluation.",
 s:["IV morphine 0.05-0.10 mg/kg (about 2-5 mg) every 15-20 min until pain score under 4; fentanyl or hydromorphone if renal dysfunction","Withhold analgesia until surgical evaluation","Oral antacid only","Liquid antacid cocktail"],
 sw:"There is no evidence that analgesia increases diagnostic errors. Monitor mental and respiratory status. Add antiemetics (ondansetron 4 or 8 mg) when vomiting.",
 p:"Algorithm order: abnormal vitals (fluids/blood) -> pain -> vomiting -> infection (broad-spectrum antibiotics) -> volume depletion -> unknown diagnosis (observe or admit)."},
{c:"Abdominal Pain",l:3,v:"70M with suspected intra-abdominal sepsis from perforated viscus; ill, HR 118, BP 92/54, lactate 4.5.",
 d:["Intra-abdominal infection with sepsis, higher-risk","Uncomplicated gastroenteritis","Biliary colic","Constipation"],
 dw:"Abdominal infections are polymicrobial; higher-risk patients (advanced age, significant comorbidities, immunosuppression, severe disease) need broader coverage.",
 s:["Prompt broad-spectrum antibiotics (meropenem 1 g IV or high-dose piperacillin-tazobactam 4.5 g IV), fluids, source control with surgery","Delay antibiotics until cultures result","Oral antibiotics","Antifungals empirically"],
 sw:"Low-risk: piperacillin-tazobactam 3.375 g IV or ertapenem 1 g IV. Empiric antifungal therapy is unusual in the ED but may be considered in critically ill immunosuppressed patients.",
 p:"High-risk features for admission: immunosuppression or advanced age, worsening exam, inability to tolerate oral hydration, unstable living situation."},

{c:"Jaundice",l:3,v:"68M with gallstones: fever 39C, RUQ pain and jaundice. HR 110, BP 98/60. Direct bilirubin and alkaline phosphatase high.",
 d:["Ascending cholangitis","Viral hepatitis","Hemolytic anemia","Gilbert syndrome"],
 dw:"Table 24.2: cholangitis is a critical biliary cause; Fever, RUQ pain and obstructive jaundice suggest ascending cholangitis (Fig 24.3 Tokyo: systemic inflammation + cholestasis + imaging).",
 s:["IV fluids, antibiotics, ultrasound or CT, and urgent biliary drainage (ERCP) with GI/surgery","Outpatient ultrasound","Observation and oral hydration","Hepatitis serologies and discharge"],
 sw:"Biliary excretion of most antibiotics is compromised in obstruction, so drainage is needed; it may be deferred 24-48 h in stable patients but should be urgent when unstable. Neither CT nor ultrasound is 100% sensitive for a common bile duct stone.",
 p:"Tokyo guidelines: one item from each of A (fever, leukocytosis, CRP), B (jaundice, abnormal LFTs) and C (imaging: dilation, stricture, stone, stent)."},
{c:"Jaundice",l:3,v:"29F, jaundice with confusion and bleeding gums. INR 2.3, AST 3000, history of large acetaminophen ingestion.",
 d:["Acute (fulminant) hepatic failure","Viral hepatitis, nonemergent","Cholelithiasis","Hemolysis"],
 dw:"Table 24.2 critical: fulminant hepatic failure (toxin, virus, alcohol, ischemia, Reye). Jaundice + encephalopathy + coagulopathy (INR > 1.5) = acute hepatic failure; AST > 1000 suggests acetaminophen toxicity or ischemia.",
 s:["Early N-acetylcysteine, ICU-level care and early liver specialist/transplant transfer; FFP only for active bleeding","Outpatient hepatology follow-up","Oral vitamin K only","Cholecystectomy"],
 sw:"NAC also offers mortality benefit in non-acetaminophen liver failure (evidence evolving). Coagulopathy in the context of acute hemorrhage can be treated with fresh frozen plasma plus packed cells.",
 p:"Admit new-onset jaundice with transaminases near 1000, bilirubin near 10 mg/dL or any coagulopathy."},
{c:"Jaundice",l:2,v:"24F, jaundice and fatigue. Hemoglobin 7, indirect bilirubin high, normal AST/ALT, normal alkaline phosphatase and PT. LDH high, haptoglobin low.",
 d:["Hemolytic disorder","Viral hepatitis","Choledocholithiasis","Pancreatic head tumor"],
 dw:"Fig 24.2 hematologic pattern: normal transaminases, alk phos and PT/PTT, normal or reduced Hgb, elevated LDH and low haptoglobin. Differential: hemolytic disorder, hematoma resorption, Gilbert syndrome.",
 s:["Type and crossmatch, reticulocytes, peripheral smear, hematology consultation","Ultrasound of the biliary tree","ERCP","Observation only"],
 sw:"Indirect hyperbilirubinemia points to a hematologic cause; direct hyperbilirubinemia indicates hepatobiliary pathology. LDH and haptoglobin if hemolysis suspected.",
 p:"Gilbert syndrome: benign hereditary hyperbilirubinemia from inadequate hepatic conjugation."},
{c:"Jaundice",l:2,v:"65M, 6 weeks of painless progressive jaundice with weight loss. No fever or abdominal pain.",
 d:["Obstructing malignancy (pancreatic head or biliary neoplasm)","Acute cholangitis","Viral hepatitis","Hemolysis"],
 dw:"Painless, progressive jaundice is the classic presentation of biliary obstruction with malignancy involving the head of the pancreas; weight loss or increasing abdominal girth is typical.",
 s:["CT abdomen with IV contrast (preferred), with GI/surgical follow-up; ultrasound is the alternative","No imaging; reassure","ERCP in the ED before any imaging","Hepatitis A vaccine"],
 sw:"CT with IV contrast evaluates the site of obstruction, resectability and disseminated disease. Ultrasound is used when high likelihood of nonmalignant biliary disease. MRCP, ERCP or endoscopic ultrasound can follow.",
 p:"Malignancy with jaundice heralds more advanced disease with increased morbidity and mortality."},
{c:"Jaundice",l:3,v:"58M with cirrhosis and ascites: fever, abdominal pain, tenderness, worsening confusion.",
 d:["Spontaneous bacterial peritonitis (SBP)","Hepatic encephalopathy alone","Budd-Chiari syndrome","Ruptured varix"],
 dw:"Fig 24.2/text: ascites with abdominal tenderness raises suspicion for SBP; a negative ascitic Gram stain does not exclude it.",
 s:["Diagnostic paracentesis, IV third-generation cephalosporin (cefotaxime 2 g or ceftriaxone 2 g), albumin infusion, stop nonselective beta blockers","Large-volume paracentesis only","Oral antibiotics","Lactulose only"],
 sw:"Albumin (initial 25% 1.5 g/kg) reduces mortality and hepatorenal syndrome. Treat until ascitic cultures result; also send blood cultures. Beta blockers increase mortality in SBP.",
 p:"SAAG of 1.1 g/dL or higher = portal hypertension (cirrhosis, heart failure); under 1.1 = peritonitis, lupus, pancreatitis."},
{c:"Jaundice",l:3,v:"31F at 34 weeks gestation: jaundice, hypertension, right upper quadrant pain, platelets 60,000, elevated liver enzymes, hemolysis.",
 d:["HELLP syndrome / severe preeclampsia","Cholestasis of pregnancy","Gilbert syndrome","Viral hepatitis"],
 dw:"Table 24.2: preeclampsia or HELLP syndrome and acute fatty liver of pregnancy are critical reproductive causes of jaundice.",
 s:["Emergent obstetric consultation and delivery planning with stabilization","Outpatient follow-up","Ursodeoxycholic acid","Observation in a week"],
 sw:"HELLP: hemolysis, elevated liver enzymes, low platelets. Cholestasis of pregnancy is nonemergent; hyperemesis gravidarum is emergent.",
 p:"Fig 24.2: HELLP syndrome is in the hepatocellular differential."},

{c:"Nausea & Vomiting",l:2,v:"20M, type 1 diabetic with polyuria, polydipsia, fruity breath, tachypnea and vomiting.",
 d:["Diabetic ketoacidosis","Gastroenteritis","Cannabinoid hyperemesis syndrome","Pancreatitis"],
 dw:"Table 25.1 DKA: polydipsia and polyuria occur early, fruity breath from serum acetone, tachypnea, signs of dehydration, possible mental status change.",
 s:["Fingerstick glucose, serum glucose, electrolytes, beta-hydroxybutyrate, VBG; IV fluids","Antiemetic and discharge","Abdominal CT first","Oral rehydration only"],
 sw:"Any protracted vomiting, especially in children, should prompt a fingerstick glucose. Fig 25.3: unstable/severe abdominal pain -> fingerstick glucose, electrolytes, pregnancy test, lactate.",
 p:"Pancreatitis can coexist with DKA; check lipase if epigastric pain."},
{c:"Nausea & Vomiting",l:2,v:"26F, 8 weeks pregnant with constant vomiting for 2 weeks, 6% weight loss, ketonuria, dry mucous membranes.",
 d:["Hyperemesis gravidarum","Nausea and vomiting of pregnancy (mild)","Molar pregnancy only","Appendicitis"],
 dw:"Table 25.1: hyperemesis: severe protracted NVP; hallmarks include 5% weight loss, ketonuria and electrolyte disturbance; benign abdomen.",
 s:["IV fluids, ondansetron IV or metoclopramide IV, electrolyte replacement; check ketones, electrolytes, ultrasound for molar or multiple pregnancy","Oral ginger only","Discharge without testing","Droperidol first-line"],
 sw:"Fig 25.4: hyperemesis -> IV fluids, ondansetron IV or metoclopramide IV, electrolyte replacement. Benefits of treatment often outweigh the risks of dehydration.",
 p:"NVP starts weeks 4-7, peaks weeks 10-16; new vomiting after week 12 or past week 20 prompts another cause."},
{c:"Nausea & Vomiting",l:1,v:"24F, 9 weeks pregnant, mild morning nausea and occasional vomiting, tolerating fluids, normal exam.",
 d:["Nausea and vomiting of pregnancy (NVP), mild","Hyperemesis gravidarum","Gastroenteritis","Ectopic pregnancy"],
 dw:"Table 25.1: NVP affects up to 75% of pregnancies, benign abdomen, may occur in the morning or all day; excellent maternal and fetal prognosis.",
 s:["Vitamin B6, ginger, metoclopramide PO or ondansetron PO; reassure","IV fluids and admission","Abdominal CT","Withhold all medications"],
 sw:"Fig 25.4: NVP -> vitamin B6, ginger, metoclopramide PO or ondansetron PO. Discuss risks of any medication in pregnancy.",
 p:"Urine pregnancy test and electrolytes help to exclude hyperemesis."},
{c:"Nausea & Vomiting",l:3,v:"37F and her husband have headache and vomiting every winter, symptoms improve when they leave the house. Furnace recently turned on.",
 d:["Carbon monoxide poisoning","Gastroenteritis","Migraine","Viral syndrome"],
 dw:"Table 25.1: headache usually present; poisoning often occurs during winter months when furnaces are on; family members (or pets) may have similar symptoms; no reliable signs of early CO.",
 s:["Co-oximetry CO level and 100% oxygen","Antiemetic and discharge home","Analgesics only","CT of the head only"],
 sw:"CO is a tasteless, odorless gas; patients may not realize they have been exposed. Critical diagnosis on Table 25.3 (emergent). Pulse oximetry is unreliable.",
 p:"Think CO when multiple household members have the same symptoms."},
{c:"Nausea & Vomiting",l:2,v:"28M, years of daily marijuana use, recurrent severe nausea and vomiting episodes relieved only by prolonged hot showers. Normal exam, dehydrated.",
 d:["Cannabinoid hyperemesis syndrome","Gastroparesis","Cyclic vomiting syndrome only","Gastric outlet obstruction"],
 dw:"Rome IV criteria: stereotypical episodic vomiting resembling cyclic vomiting, after prolonged excessive cannabis use, relief by sustained cessation; hot bathing behaviors.",
 s:["IV fluids, electrolyte replacement, analgesics, antiemetic, benzodiazepine; counsel cessation","Daily opioids","Colonoscopy","Surgery consultation"],
 sw:"Fig 25.4: CVS or CHS -> IV fluids, electrolyte replacement, analgesics, antiemetic, benzodiazepine. Droperidol or haloperidol may help. Ask about marijuana use in every patient with cyclic vomiting.",
 p:"Symptom onset at least 6 months before diagnosis; criteria fulfilled for the last 3 months."},
{c:"Nausea & Vomiting",l:2,v:"45M vomiting; ondansetron 4 mg IV and metoclopramide 10 mg IV did not help. Mechanical obstruction considered unlikely. QTc is normal.",
 d:["Undifferentiated nausea and vomiting, refractory to first-line agents","Small bowel obstruction","Cannabinoid hyperemesis","Vertigo"],
 dw:"Fig/text: inadequate response to antiemetics should prompt consideration of an underlying mechanical GI obstruction; if unlikely, move to the next agent.",
 s:["Droperidol 1.25 mg IV (after ECG for QT) or haloperidol 5 mg IV, repeat after 30 min if needed","Repeat ondansetron 16 mg","Promethazine IV push undiluted","Add dimenhydrinate"],
 sw:"Droperidol has an FDA QT black box warning; ECG first. If not safe, next: prochlorperazine 10 mg IV or promethazine 12.5 mg IM/IV (dilute IV; extravasation can cause severe tissue injury, deep IM preferred). Never combine promethazine and dimenhydrinate.",
 p:"Elders or those on sedatives: start promethazine at 6.25 mg."},
{c:"Nausea & Vomiting",l:3,v:"55M vomits undigested food eaten more than 12 hours ago, early satiety, weight loss, succussion splash.",
 d:["Gastric outlet obstruction","Gastroenteritis","Migraine","Appendicitis"],
 dw:"Vomiting more than 1 hour after eating suggests gastric outlet obstruction or gastroparesis; vomiting of food eaten more than 12 hours previously is pathognomonic for outlet obstruction. Table 25.4: undigested food.",
 s:["Imaging for gastric outlet obstruction (CT or upper GI), NG decompression, electrolytes","Antiemetic and discharge","Prokinetic only","Abdominal plain film only"],
 sw:"Table 25.3: gastric outlet obstruction is an emergent diagnosis. Check for hypokalemic hypochloremic metabolic alkalosis.",
 p:"Table 25.6 sequelae: hypovolemia, metabolic alkalosis, hypokalemia, Mallory-Weiss tears, Boerhaave, aspiration pneumonitis."},
{c:"Nausea & Vomiting",l:3,v:"62M, nausea and vomiting with a morning headache, ataxia, papilledema, normal abdomen.",
 d:["Raised intracranial pressure / CNS mass","Gastroenteritis","Biliary colic","Pancreatitis"],
 dw:"Symptoms primarily in the morning may suggest increased intracranial pressure; chronic headache with N/V and vomiting without preceding nausea suggest CNS pathology; papilledema (Table 25.5) = increased ICP.",
 s:["Neurologic exam and cranial imaging (CT head); if comatose protect airway, CT head, consider LP if CT normal","Antiemetic and abdominal CT","Discharge home","Prokinetic therapy"],
 sw:"Fig 25.3: neurological deficits or comatose -> consider ICH, posterior CVA, meningitis, drug ingestion -> airway protection, CT head, LP if CT normal.",
 p:"Nystagmus: labyrinthitis, vertebrobasilar insufficiency, cerebellar infarct or bleed, CPA tumor."},
{c:"Nausea & Vomiting",l:1,v:"4-year-old, acute vomiting and diarrhea for a day, mild dehydration, well-appearing, taking small sips.",
 d:["Acute gastroenteritis","Pyloric stenosis","Appendicitis","DKA"],
 dw:"Acute gastroenteritis is the most common cause of vomiting in children.",
 s:["Oral rehydration with oral ondansetron (0.15 mg/kg)","IV fluids and IV ondansetron","Metoclopramide IV","Promethazine"],
 sw:"Fig 25.4: pediatric gastroenteritis: mild to moderate dehydration -> oral rehydration plus ondansetron PO; severe dehydration -> IV fluids plus IV ondansetron. Ondansetron is first-line in children with the most robust evidence.",
 p:"Meta-analysis: ondansetron improved cessation of vomiting after 1 hour and reduced failure of oral rehydration."},

{c:"GI Bleeding",l:3,v:"58M with cirrhosis: hematemesis, BP 84/50, HR 126, large-volume bloody emesis.",
 d:["Variceal upper GI bleed with hemorrhagic shock","Mallory-Weiss tear","Gastroenteritis","Hemorrhoidal bleed"],
 dw:"Fig 26.1 high-risk UGIB: continued brisk bleeding, hemodynamically unstable, concerning history. Cirrhosis plus hematemesis suggests varices.",
 s:["Two large-bore IVs, crystalloid and blood, IV octreotide 50 microgram bolus then 50 microgram/h, IV PPI, ceftriaxone prophylaxis, emergent GI for endoscopy and ICU","Wait for hemoglobin to fall","Routine FFP for INR","Tranexamic acid"],
 sw:"Octreotide for variceal bleeding, known liver disease or alcoholism; antibiotic prophylaxis in suspected cirrhosis (ciprofloxacin 400 mg IV or ceftriaxone 1-2 g IV). Restrictive transfusion Hgb 7-8 in UGIB; overtransfusion worsens portal hypertension.",
 p:"Concerning history: blood loss over 500 mL, previous vascular surgery, anticoagulants, lactate over 4, Hgb under 10 or drop over 1."},
{c:"GI Bleeding",l:3,v:"52M with known varices: ongoing exsanguinating hematemesis, endoscopy is not promptly available.",
 d:["Massive variceal bleed","Peptic ulcer, stable","Mallory-Weiss","Gastritis"],
 dw:"Rapidly exsanguinating presumed variceal bleed with no prompt endoscopy: balloon tamponade is indicated as a temporizing measure.",
 s:["Place a balloon tamponade device (Sengstaken-Blakemore or Minnesota tube) as a bridge to definitive therapy","Oral PPI","Observe on the ward","Nasogastric lavage only"],
 sw:"There are significant complications, so tamponade is only a temporizing measure for ongoing life-threatening bleeding. Continue resuscitation, octreotide, antibiotics and endoscopy.",
 p:"NG lavage is not recommended for diagnosis of suspected UGIB."},
{c:"GI Bleeding",l:1,v:"30M with one episode of coffee-ground emesis after drinking. HR 76, BP 124/78, Hgb normal, BUN normal, no melena, no syncope, no liver or heart disease.",
 d:["Low-risk upper GI bleed (Glasgow-Blatchford 0)","High-risk UGIB","Massive variceal bleed","Lower GI bleed"],
 dw:"Table 26.2: BUN, Hgb, SBP, pulse, melena, syncope, hepatic disease and heart failure all score 0 here, so the Glasgow-Blatchford score is 0.",
 s:["Discharge with outpatient GI follow-up","Emergent endoscopy and ICU","Urgent transfusion","Octreotide infusion"],
 sw:"Fig 26.1: indeterminate-risk UGIB, risk stratify with Glasgow-Blatchford; low risk -> discharge with outpatient GI follow-up; not low risk -> hospital admission and urgent GI consult.",
 p:"GBS items: BUN, Hgb (sex specific), SBP, pulse over 100, melena, syncope (2), hepatic disease (2), heart failure (2)."},
{c:"GI Bleeding",l:2,v:"68M with coronary artery disease, ongoing melena, HR 110, Hgb 8.4, chest pressure.",
 d:["Upper GI bleed with symptomatic coronary disease","Hemorrhoidal bleed","Diverticular bleed","Gastroenteritis"],
 dw:"Anemia and tachycardia with CAD risks cardiac ischemia from blood loss; significant UGIB. Table 26: susceptible patients can develop acute coronary syndrome with significant blood loss.",
 s:["Transfuse to Hgb greater than 9 g/dL (or until ischemia resolves), ECG, IV PPI, GI consultation","Transfuse only if Hgb under 7","Oral iron","FFP routinely"],
 sw:"Restrictive transfusion threshold is 7-8 g/dL in acute UGIB generally; for symptomatic or known CAD transfuse to a minimum Hgb greater than 9 or to resolve cardiac ischemia.",
 p:"Platelet transfusion goal: keep platelets over 50,000 in UGIB; routine platelets for antiplatelet users are not recommended."},
{c:"GI Bleeding",l:3,v:"72M on warfarin (INR 4.8) with melena, BP 88/52, HR 120.",
 d:["Anticoagulant-associated UGIB with shock","Hemorrhoidal bleed","Stable low-risk UGIB","Esophageal reflux"],
 dw:"Unstable GI bleed with anticoagulant use is high risk: concerning history includes anticoagulants.",
 s:["Resuscitate; reverse warfarin with PCC (or FFP) plus vitamin K; do not delay early endoscopy for INR correction","Delay endoscopy until INR is below 1.5","Vitamin K PO only","No reversal"],
 sw:"Endoscopy generally should not be postponed while awaiting correction. PCC corrects coagulopathy rapidly with lower volume; FFP needs large volumes. Vitamin K prevents rebound. Idarucizumab reverses dabigatran; PCC or recombinant inactivated factor Xa for Xa inhibitors.",
 p:"Routine FFP/PCC for elevated INR in liver disease is controversial and may worsen portal hypertension and thrombosis."},
{c:"GI Bleeding",l:2,v:"60M, stable, epigastric pain, suspected bleeding peptic ulcer, active hematemesis. Awaiting endoscopy in 2 hours.",
 d:["Bleeding peptic ulcer, stable upper GI bleed","Variceal bleed","Mallory-Weiss tear","Lower GI bleed"],
 dw:"Epigastric pain may indicate PUD. Stable vitals with ongoing UGIB: indeterminate risk, needs hospital admission and GI consult.",
 s:["IV PPI (omeprazole 80 mg IV then 40 mg q12h) and erythromycin 250 mg IV 30-120 min before EGD","Octreotide for all UGIB","Tranexamic acid","Antibiotics for all"],
 sw:"High-dose PPI decreases rebleeding, surgery and mortality in bleeding ulcers; intermittent dosing is as effective as continuous infusion. Erythromycin improves visualization. Octreotide has no rationale in nonvariceal bleeding; TXA is not recommended.",
 p:"Massive transfusion (over 4 units PRBC): balanced 1:1:1 PRBC:platelets:FFP."},
{c:"GI Bleeding",l:3,v:"66M, brisk bright red blood per rectum, HR 118, BP 90/60.",
 d:["Brisk lower GI bleed, unstable (high risk)","Hemorrhoids","Stable indeterminate LGIB","Anal fissure"],
 dw:"Fig 26.1 lower GI bleed high-risk: brisk bright red bleeding, hemodynamically unstable. Hematochezia can also be a brisk UGIB.",
 s:["Resuscitation (2 large-bore IVs, crystalloid, blood), CT angiography, IR consult; surgery if CTA does not localize; ICU","Outpatient colonoscopy","Bowel prep and elective colonoscopy","Observe on the ward"],
 sw:"Brisk LGIB: emergent consult with interventional radiology for possible selective embolization; simultaneous surgery consult. If the source is not identified on CTA, unstable patients may need urgent surgical intervention.",
 p:"Upper GI origin should be considered in a hemodynamically unstable patient with hematochezia."},
{c:"GI Bleeding",l:1,v:"42M with a streak of bright red blood on toilet paper, seen at the anus (hemorrhoid), stable vitals, no comorbidities.",
 d:["Hemorrhoidal lower GI bleed, low risk","Brisk LGIB","Massive UGIB","Colon cancer, emergent"],
 dw:"Fig 26.1 LGIB indeterminate risk: bleeding source seen, stable vitals, no comorbidities, age under 60.",
 s:["Discharge with outpatient GI follow-up","Hospital admission and urgent colonoscopy","CTA","Surgery consult"],
 sw:"Those not meeting all four criteria (source seen, stable, no comorbidity, age under 60) get hospital admission and urgent GI/colonoscopy.",
 p:"Constipation or painful BMs precede bleeding from hemorrhoids or fissure; recent colonoscopy suggests postpolypectomy bleeding."},

{c:"Diarrhea",l:3,v:"75M with 3 days of watery diarrhea, ill-appearing, BP 88/50, HR 124, dry mucosa.",
 d:["Acute diarrhea with hypovolemic shock (toxic, abnormal vitals)","Benign viral gastroenteritis","Irritable bowel syndrome","Lactose intolerance"],
 dw:"Fig 27.1: ill-appearing, toxic or abnormal vital signs -> critical; evaluate for shock (hypovolemic, septic or hemorrhagic).",
 s:["IV fluid bolus, check labs (creatinine, hemoglobin, lactate), consider imaging, and hospitalize","Oral rehydration and discharge","Loperamide and discharge","Stool culture only"],
 sw:"Resuscitate including IV fluids while evaluating the underlying etiology; elders, children and immunocompromised are at risk for shock. Fig 27.2: concerning results -> hospitalize.",
 p:"Heart rate may be unreliable in patients on antiarrhythmics or with a pacemaker."},
{c:"Diarrhea",l:1,v:"25M, 2 days of loose stools and vomiting, mild dehydration, normal vitals, tolerating fluids.",
 d:["Acute viral gastroenteritis (benign)","Cholera","C. difficile","HUS"],
 dw:"Fig 27.1: no ill-appearance, no risk factors for non-benign diarrhea, no recent travel -> likely viral illness, supportive care.",
 s:["Oral rehydration solution or clear liquids, supportive care, discharge","IV fluids and admission","Empiric antibiotics","CT abdomen"],
 sw:"WHO-ORS per liter: 3.5 g NaCl, 2.9 g trisodium citrate (or 2.5 g bicarbonate), 1.5 g KCl, 20 g glucose. Avoid caffeine and high-sugar drinks; dairy may worsen for 2 weeks. Antimotility (loperamide 4 mg then 2 mg, max 16 mg/day) can relieve symptoms in nontoxic patients.",
 p:"Disposition: able to stay hydrated and care for self at home -> discharge."},
{c:"Diarrhea",l:2,v:"68F on clindamycin for 10 days, more than 5 watery stools a day for 3 days, low-grade fever, WBC high.",
 d:["Clostridioides difficile infection","Norovirus","Giardiasis","Hemolytic uremic syndrome"],
 dw:"Table 27.2: antibiotic therapy -> C. difficile. Testing is considered with antibiotic use in the last 3 months, recent hospitalization and significant diarrhea (more than 5/day) for several days.",
 s:["C. difficile assay (quantitative PCR) and appropriate treatment","Loperamide","Stool culture panel only","Discharge without testing"],
 sw:"Cephalosporins, penicillins, fluoroquinolones and clindamycin are most often implicated; community-acquired C. difficile is increasing. Leukocytosis may be seen.",
 p:"Avoid antimotility agents when C. difficile or invasive disease is suspected."},
{c:"Diarrhea",l:3,v:"6-year-old with bloody diarrhea after eating undercooked beef, now pale with decreased urine output. Hgb low, platelets low, creatinine high.",
 d:["Hemolytic uremic syndrome from Shiga toxin E. coli O157:H7","Norovirus","Intussusception","Giardiasis"],
 dw:"Box 27.1: E. coli O157:H7 is associated with HUS; suspect with anemia, thrombocytopenia and renal dysfunction.",
 s:["Shiga toxin assay, CBC/creatinine/electrolytes, IV hydration, avoid antimotility agents, admit","Loperamide","Outpatient follow-up","Empiric fluoroquinolone"],
 sw:"Check hemoglobin to screen for anemia secondary to blood loss or HUS. Stool Shiga toxin assay should be considered in outbreaks or with suspected HUS.",
 p:"Raw beef/farm animals/petting zoos: Salmonella, E. coli O157:H7, Shiga toxin producers."},
{c:"Diarrhea",l:2,v:"30F back from a week in Southeast Asia with watery diarrhea, cramps, no blood, no fever, vitals normal.",
 d:["Traveler's diarrhea","Viral gastroenteritis only","Inflammatory bowel disease","C. difficile"],
 dw:"Fig 27.1: recent travel -> possible traveler's diarrhea. Enterotoxigenic E. coli (ETEC) is implicated; Table 27.2 travel history.",
 s:["Consider empiric antibiotic treatment plus oral rehydration","Stool culture then wait","CT abdomen","IV fluids and admit"],
 sw:"Stool cultures are generally not indicated in the ED given low sensitivity and delayed results. Testing for specific pathogens does not guide initial therapy.",
 p:"Parasitic infections (Giardia, Cryptosporidium) usually present as chronic diarrhea; test stool for ova and parasites in travelers with prolonged symptoms."},
{c:"Diarrhea",l:2,v:"28M returned from camping, drank untreated stream water, 2 weeks of foul greasy diarrhea, bloating, weight loss. Normal vitals.",
 d:["Giardiasis","C. difficile","Norovirus","Ischemic colitis"],
 dw:"Table 27.2: wilderness or untreated water exposure -> Giardia or Cryptosporidium; Giardia may cause acute and chronic malabsorptive diarrhea.",
 s:["Giardia antigen assay and stool examination for ova and parasites; outpatient treatment and follow-up","CT abdomen","Antimotility only","Stool culture only"],
 sw:"Most parasitic infections present as chronic diarrhea. Consider testing for those exposed to poor sanitation, immune compromise or travel.",
 p:"Cryptosporidium, Cyclospora, Entamoeba histolytica, Giardia: protozoa listed in Box 27.1."},
{c:"Diarrhea",l:3,v:"34M with rice-water profuse diarrhea after eating raw shellfish in the tropics, dehydrated, weak, BP 80/50.",
 d:["Cholera (Vibrio cholerae) with hypovolemic shock","Norovirus","Giardia","Irritable bowel"],
 dw:"Vibrio cholerae: contaminated water or seafood, secretory enteritis with profuse watery diarrhea, large fluid and electrolyte losses; shock, renal failure and death.",
 s:["Aggressive IV isotonic fluids (1-2 L bolus then 300-500 mL/h until hydrated), electrolytes, admit; antibiotics per local guidance","Oral rehydration only and discharge","Antimotility","Observation at home"],
 sw:"Normal saline or lactated Ringer's by bolus then infusion until well hydrated and passing normal or dilute urine; reduce rates in heart failure. Pediatric bolus is 20 mL/kg.",
 p:"Vibrio vulnificus: raw shellfish, septicemia, high mortality, especially with liver disease."},
{c:"Diarrhea",l:3,v:"41M with HIV, CD4 count 30, bloody diarrhea and abdominal pain, fever.",
 d:["Cytomegalovirus colitis / invasive enteropathogens","Simple viral gastroenteritis","Irritable bowel syndrome","Lactose intolerance"],
 dw:"Gastrointestinal CMV is associated with immunosuppression and advanced HIV (CD4 under 50) and can lead to severe hemorrhagic colitis. Table 27.2: HIV -> severe illness from bacteria, spore-forming protozoa, CMV and MAC.",
 s:["Labs and stool studies, IV fluids, hospitalization with GI/ID involvement","Oral rehydration and discharge","Loperamide","Reassurance"],
 sw:"Immunosuppressed patients, toxic patients and those with fever and bloody diarrhea need bacterial testing; hospitalize when abnormal.",
 p:"Gross blood in stool usually justifies consideration of antibiotics; a positive guaiac alone should not."},

{c:"Constipation",l:3,v:"82M nursing home resident with chronic fecal retention, now abdominal pain and distention, fever and peritonitis. CT shows colonic wall thickening and extraluminal air.",
 d:["Stercoral perforation from fecal impaction","Simple constipation","Irritable bowel syndrome","Colon cancer, stable"],
 dw:"Stercoral perforation results from severe chronic constipation causing fecal impaction in the large bowel, pressure necrosis and perforation; typically diagnosed on CT.",
 s:["CT, resuscitation, antibiotics and urgent surgical consultation","Manual disimpaction at bedside","Osmotic laxatives","Discharge with enema"],
 sw:"Surgical consultation is necessary for suspected perforation or obstruction. Constipation is rarely associated with morbidity; most negative outcomes are missed obstruction or perforation.",
 p:"Constipation with abdominal pain or tenderness: rule out emergent conditions first."},
{c:"Constipation",l:2,v:"60M on chronic oxycodone for cancer pain with constipation, no abdominal findings, no red flags.",
