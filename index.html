 d:["Opioid-induced constipation","Bowel obstruction","Hirschsprung disease","Colon cancer"],
 dw:"Opioids are the most common drug cause of constipation, nearly universal due to GI opioid receptors; Table 28.1 medication side effects.",
 s:["Stimulant or osmotic laxative; if refractory, peripherally acting mu-opioid antagonist (naloxegol, methylnaltrexone, naldemedine)","Increase opioid dose","Docusate alone","Stop pain control"],
 sw:"PAMORAs block GI mu receptors without compromising analgesia or precipitating withdrawal. Patients on chronic opioids need bowel regimens (fiber, stimulant laxatives).",
 p:"Docusate is no better than placebo and not first-line."},
{c:"Constipation",l:2,v:"35F with severe pain on defecation, a visible anal fissure, hard stools, normal abdomen.",
 d:["Constipation secondary to painful anal fissure","Perianal abscess","Rectal prolapse","Bowel obstruction"],
 dw:"Fig 28.1: abnormal rectal exam with fissure and considerable pain with defecation. Acute constipation often results from avoidance of defecation due to painful perianal lesions.",
 s:["Stool softener (docusate), mineral oil or glycerin; osmotic laxative; outpatient follow-up","Emergent drainage","CT abdomen","Opioids"],
 sw:"Docusate may be somewhat helpful in anal fissures or hemorrhoids because it makes defecation less painful. Perirectal abscess is treated by drainage.",
 p:"Hematochezia or perianal pain should prompt anorectal exam; consistent rectal pain over years suggests chronic sensorimotor issue."},
{c:"Constipation",l:2,v:"58M with new constipation for 3 weeks, 10 kg weight loss and blood in the stool. Family history of colon cancer.",
 d:["Possible colorectal malignancy / obstructing lesion","Primary functional constipation","Medication side effect","Hypothyroidism"],
 dw:"Important features: fever, anorexia, nausea, vomiting, blood in stool, significant weight loss, family history of colon cancer, onset after age 50.",
 s:["Rectal exam, CBC for anemia, imaging as indicated (CT) and urgent GI follow-up","Reassure and give fiber","Plain film to exclude","Enema and discharge"],
 sw:"Plain abdominal radiographs documenting increased stool load should not be used to exclude more serious disorders. Blood in the stool: check hemoglobin or CBC.",
 p:"Acute onset in an elderly patient is also concerning."},
{c:"Constipation",l:1,v:"45F with chronic constipation (over 3 months), normal exam, no alarm features, no medication cause.",
 d:["Chronic functional constipation","Obstructing tumor","Hirschsprung","Cauda equina"],
 dw:"Fig 28.1 chronic (>3 months) constipation: stepwise approach with no secondary cause.",
 s:["Step 1 lifestyle/fiber/water; Step 2 bulk laxatives; Step 3 osmotic (PEG, lactulose) or stimulant (senna, bisacodyl); Step 4 secretagogues or prucalopride","Immediate colonoscopy","CT abdomen","Daily enemas"],
 sw:"Acute constipation (under 3 months): osmotic or stimulant laxatives first (PEG, senna, bisacodyl, milk of magnesia). Caution with magnesium and sodium phosphate in renal insufficiency.",
 p:"Secretagogues: lubiprostone, linaclotide, plecanatide; prokinetic: prucalopride."},

{c:"Pelvic Pain",l:3,v:"23F, sudden severe left lower pain with nausea and vomiting, history of ovarian cyst, adnexal mass and tenderness, hCG negative.",
 d:["Ovarian torsion","Ureteral colic","Appendicitis","PID"],
 dw:"Table 29.1: ovarian torsion: acute onset of moderate to severe lateral pain with nausea and vomiting; history of ovarian mass or cyst; adnexal mass and tenderness; torsion can be intermittent.",
 s:["Pelvic ultrasound with Doppler and urgent gynecology consultation; laparoscopy may be needed even if Doppler is normal","CT and discharge","Antibiotics","Observe for 48 hours"],
 sw:"Torsion may be radiographically occult; if suspected, gynecology consultation should be obtained because laparoscopy may be needed for definitive diagnosis.",
 p:"Early analgesia (IV morphine or hydromorphone) improves the exam and is safe in pregnancy."},
{c:"Pelvic Pain",l:2,v:"22F with fever, vaginal discharge, bilateral lower abdominal pain, cervical motion tenderness, multiple partners.",
 d:["Pelvic inflammatory disease (PID)","Ectopic pregnancy","Appendicitis","Simple cystitis"],
 dw:"Table 29.1: PID: fever, vaginal discharge, history of unprotected intercourse or multiple partners; pus from cervical os, adnexal tenderness, peritonitis suggests TOA or severe PID.",
 s:["Pregnancy test, cervical cultures, CBC/CRP, pelvic ultrasound for TOA, treat for PID; admit if TOA or severe","Discharge without treatment","Surgery consult first","Urinalysis only"],
 sw:"Fig 29.2: treat for PID if suspected; well-appearing and tolerating oral fluids may be discharged with precautions and follow-up; otherwise consult GYN or surgery. TOA is urgent-emergent.",
 p:"History and exam may be inaccurate for PID diagnosis; WBCs on wet prep are common."},
{c:"Pelvic Pain",l:3,v:"29F, positive pregnancy test, severe pelvic pain, BP 80/45, HR 130, FAST shows free fluid in Morison pouch.",
 d:["Ruptured ectopic pregnancy (presumptive)","Ruptured hemorrhagic ovarian cyst","PID","Appendicitis"],
 dw:"Fig 29.2: pregnant, under 20 weeks, free fluid on FAST or no definite IUP -> presumptive ectopic pregnancy.",
 s:["Volume and blood, STAT GYN, FAST; Rh immune globulin (RhoGAM) if Rh negative","Observation","CT scan","Repeat hCG in 48 hours"],
 sw:"Patients in extremis are most likely hemorrhaging. Rapid treatment with fluid and blood products; may require surgical intervention before stabilization.",
 p:"Women of reproductive age with positive pregnancy and hemodynamic instability + free fluid = ruptured ectopic."},
{c:"Pelvic Pain",l:2,v:"26F, positive hCG, mild pain, stable, ultrasound shows no definite intrauterine pregnancy or ectopic.",
 d:["Pregnancy of unknown location (PUL)","Confirmed viable IUP","Ruptured ectopic","Ovarian torsion"],
 dw:"PUL: positive pregnancy test with neither an IUP nor an ectopic seen on ultrasound. A definite IUP excludes ectopic with high certainty; absence of one is presumed ectopic until further evaluation.",
 s:["Quantitative beta-hCG, Rh status, ectopic precautions and return in 48 hours for reevaluation with OB follow-up","Discharge without follow-up","Methotrexate now","CT scan"],
 sw:"Fig 30.1: PUL -> return in 48 hours for reevaluation. Ectopic -> OB consult. Check Rh status and give RhoGAM if Rh negative. A gestational sac alone is not enough to confirm an IUP.",
 p:"Discriminatory zone traditionally about 2000 IU/mL for TVUS but its value is questioned."},
{c:"Pelvic Pain",l:3,v:"28F at 30 weeks gestation, vaginal bleeding with severe constant abdominal pain, fundal tenderness and a rigid uterus.",
 d:["Placental abruption","Placenta previa","Round ligament pain","Braxton Hicks contractions"],
 dw:"Fig 29.2: pregnant over 20 weeks with fundal tenderness or vaginal bleeding -> presumptive placenta previa or abruption (STAT OB, RhoGAM PRN). Abruption: painful bleeding, tender uterus.",
 s:["Volume and blood, STAT OB consultation, fetal monitoring, Rh status/RhoGAM","Pelvic exam first","Discharge with precautions","CT abdomen"],
 sw:"Ultrasound to evaluate for placenta before digital exam in third-trimester bleeding. Pregnant patients past fetal viability (about 20 weeks) need fetal monitoring before discharge; also after abdominal trauma.",
 p:"Placental abruption, placenta previa and uterine rupture can cause life-threatening hemorrhage with no or minimal bleeding."},
{c:"Pelvic Pain",l:2,v:"25F, 10 weeks pregnant, RLQ pain, low-grade fever, nondiagnostic transabdominal and transvaginal ultrasound.",
 d:["Possible appendicitis in pregnancy","Ectopic pregnancy","Round ligament pain","PID"],
 dw:"Pelvic pain with right-sided pain: appendicitis is considered. Fig 29.2: clinical concern for appendicitis -> CT (MRI if pregnant) or observe and reexamine.",
 s:["MRI (avoids radiation and delay) and surgical consultation","CT with contrast","Discharge","Repeat ultrasound next week"],
 sw:"When ultrasound is nondiagnostic in a pregnant patient suspected of appendicitis, MRI avoids disease progression during prolonged observation and avoids ionizing radiation.",
 p:"Appendicitis in pregnancy appears in the RUQ differential list (Fig 23.1)."},

{c:"Vaginal Bleeding",l:3,v:"32F with heavy vaginal bleeding, pale, HR 130, BP 85/50, not pregnant.",
 d:["Hemorrhagic shock from abnormal uterine bleeding","Stable AUB","Vulvovaginitis","Cystitis"],
 dw:"Fig 30.1: unstable vaginal bleeding -> resuscitate and immediate GYN consult.",
 s:["Resuscitate (fluids/blood) and immediate GYN consultation","Oral NSAIDs and discharge","OCP taper and discharge","Observation only"],
 sw:"Unstable pregnant and postpartum patients: manage in close consultation with an obstetrician. Uterine tamponade (Foley or Bakri balloon) can be used for severe bleeding.",
 p:"Pregnancy test first in every woman of reproductive age."},
{c:"Vaginal Bleeding",l:2,v:"38F, stable, heavy menstrual bleeding for 10 days, nonpregnant, hemoglobin 10, no contraindications.",
 d:["Acute abnormal uterine bleeding (e.g., ovulatory dysfunction, fibroids), stable","Placenta previa","Ectopic","Hemorrhagic shock"],
 dw:"Fig 30.1 stable nonpregnant: assess for anemia, transfuse as indicated, treatment depends on age and cause, ensure timely GYN follow-up.",
 s:["Tranexamic acid or NSAIDs; or combination oral contraceptive taper if no contraindication; GYN follow-up","IV conjugated estrogen routinely","No treatment","Emergent hysterectomy"],
 sw:"TXA 1.3 g PO every 6-8 h up to 5 days; ibuprofen 200-400 mg tid-qid; monophasic pill with under 35 microgram ethinyl estradiol (one pill bid for 5 days then qd, or tid for 7 days). Do not use TXA with combined oral contraceptives.",
 p:"Divide patients by age: premenarchal, reproductive age, postmenopausal."},
{c:"Vaginal Bleeding",l:3,v:"41F smoker with prior DVT, heavy abnormal bleeding, stable. Estrogen is contraindicated.",
 d:["AUB where estrogen and TXA are contraindicated","Uncomplicated AUB, any therapy fine","Placenta previa","Ectopic"],
 dw:"Table 30.1: estrogens and combined OCPs are contraindicated in women over 35 who smoke or with DVT/PE; TXA is contraindicated with current or past thromboembolic disease.",
 s:["Progestin-only therapy (medroxyprogesterone) or NSAIDs, with GYN follow-up","Combination OCPs","Tranexamic acid","IV conjugated equine estrogen"],
 sw:"High-dose progestin-only therapy is an alternative: medroxyprogesterone 20 mg tid for 7 days (table; text also cites 10 mg daily for 10 days). NSAIDs are contraindicated in advanced renal disease; use caution with GI bleed history.",
 p:"Contraindications to estrogen: thromboembolic event or stroke, pregnancy, active liver disease, severe uncontrolled HTN, smoker over 35."},
{c:"Vaginal Bleeding",l:2,v:"27F Rh-negative, 8 weeks pregnant by dates, light vaginal bleeding, stable, mild cramping.",
 d:["Threatened abortion vs ectopic: location must be determined","Placenta previa","Postmenopausal bleeding","Vulvovaginitis"],
 dw:"Fig 30.1: pregnant under 20 weeks -> ultrasound to determine pregnancy location, check Rh status, RhoGAM if Rh negative.",
 s:["Ultrasound for pregnancy location, check Rh status and give Rho(D) immune globulin","Discharge without testing","CT","Methylergonovine"],
 sw:"IUP: viable or nonviable -> prompt OB follow-up; ectopic -> OB consult; PUL -> return in 48 hours. Threatened, incomplete or missed miscarriage can be managed expectantly with close GYN follow-up.",
 p:"Approximately 50% of women with early bleeding go on to miscarry; ectopic prevalence in the ED first trimester bleeding patients is 18%."},
{c:"Vaginal Bleeding",l:2,v:"68F, postmenopausal vaginal bleeding, stable.",
 d:["Endometrial atrophy vs gynecologic cancer","Ovulatory dysfunction","Placenta previa","Vulvovaginitis only"],
 dw:"Fig 30.1 postmenopausal: gynecologic cancer, endometrial atrophy. Perimenopausal and menopausal bleeding needs expedited follow-up for possible malignancy.",
 s:["Stable: discharge with expedited GYN follow-up for evaluation of malignancy","Reassure and no follow-up","Combination OCPs","Emergent hysterectomy"],
 sw:"Most nonpregnant patients with vaginal bleeding can be discharged with timely GYN follow-up. Adolescents likely have anovulatory cycles but consider a bleeding disorder.",
 p:"If sexual abuse is suspected in a prepubertal girl, a safe environment must be ensured before discharge."},

{c:"Back Pain",l:3,v:"58M, sudden tearing back pain with nausea, diaphoresis, syncope. BP 190/100 right arm and 140/80 left arm, new aortic insufficiency murmur.",
 d:["Aortic dissection","Mechanical low back pain","Renal colic","Muscle strain"],
 dw:"Table 31.1 critical vascular: sudden onset, tearing severe chest and/or back pain, unequal upper-extremity BPs, new aortic insufficiency murmur, neurologic deficits secondary to ischemia.",
 s:["Emergent imaging (CT angiography, transesophageal echo or MRI depending on stability) with BP/HR control and surgical consultation","NSAIDs and discharge","Lumbar spine x-ray","MRI lumbar spine"],
 sw:"Fig 31.1: abnormal vital signs -> shock/syncope: dissection, AAA, sepsis, PE; HTN/unequal UE pressures/AI murmur: dissection. Choice of imaging depends on stability and equipment availability.",
 p:"Dissection is more common as the cause of thoracic back pain."},
{c:"Back Pain",l:3,v:"73M, hypertension and smoker, isolated severe back pain with syncope, pulsatile mass, pulse deficit in the legs.",
 d:["Ruptured or expanding abdominal aortic aneurysm","Mechanical back pain","Disc herniation","Osteoporotic fracture"],
 dw:"Isolated back pain is one of the classic presentations of a contained ruptured AAA; pulsatile mass, bruits, hypoperfusion; pain can mimic renal colic, GI bleeding, diverticulitis and MI; 30% of signs are misdiagnosed.",
 s:["Bedside ultrasound; if stable CT with contrast; emergent surgical/vascular consultation","Plain lumbar film","Oral analgesia and discharge","MRI of lumbar spine"],
 sw:"Distinguish renal colic from AAA in older patients; both may present with nausea, diaphoresis or syncope and hematuria may be present in either.",
 p:"Vital signs may be normal in 70% of AAA."},
{c:"Back Pain",l:3,v:"52M with diabetes and IV drug use: fever, severe back pain with midline spine tenderness, new leg weakness.",
 d:["Spinal epidural abscess","Mechanical low back pain","Muscle spasm","Aortic dissection"],
 dw:"Table 31.1: at-risk population (DM, IVDU, immunosuppression, recent bacteremia); fever 50%, back pain 75%; focal neurologic deficits are late findings; classic triad present in only 15%; S. aureus most common.",
 s:["Urgent MRI with contrast, ESR/CRP, blood cultures, start IV antibiotics immediately, neurosurgical consult","Oral NSAIDs and discharge","Hold antibiotics until biopsy","Plain films only"],
 sw:"ESR/CRP are sensitive (80-100%) but nonspecific; if MRI is contraindicated, CT with contrast is next best. About 5% die from sepsis, so do not wait for imaging to give antibiotics in the ill patient.",
 p:"Fig 31.2: infection risk (fever, abnormal neuro exam, IVDU, recent bacterial infection, immunocompromise, spinal instrumentation) -> MRI."},

];
var CHAPTERS=["Fever","Weakness","Cyanosis","Syncope","Coma","Confusion","Seizure","Vertigo","Headache","Diplopia","Red Eye","Sore Throat","Hemoptysis","Dyspnea","Chest Pain","Abdominal Pain","Jaundice","Nausea & Vomiting","GI Bleeding","Diarrhea","Constipation","Pelvic Pain","Vaginal Bleeding","Back Pain"];
var RANKS=["Intern","Junior Resident","Resident","Senior Resident","Chief Resident","Registrar","Consultant","Professor of EM"];
var KEY="emArena_v1";
var S={xp:0,best:0,tot:0,ok:0,chap:{},missed:[]};
try{var raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(id){return document.getElementById(id)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function lvl(){return Math.floor(S.xp/150)}
function rank(){return RANKS[Math.min(lvl(),RANKS.length-1)]}
function pop(t){var p=$("pop");p.textContent=t;p.classList.add("show");setTimeout(function(){p.classList.remove("show")},900)}

var G=null; // game session
function home(){
 var l=lvl(),into=S.xp-l*150;
 var h='<h1>EM Case Arena</h1><div class="sub">Read the case, pick the diagnosis, then the next best step. Built from your Rosen Part I chapters (Ch 8-31).</div>';
 h+='<div class="card"><div class="row"><b>'+rank()+'</b><span class="pill">Lv '+(l+1)+'</span><span class="sp"></span><span class="pill">'+S.xp+' XP</span></div>';
 h+='<div class="bar" style="margin:10px 0"><i style="width:'+(into/150*100)+'%"></i></div>';
 h+='<div class="row"><div class="stat"><b>'+S.tot+'</b><span>Answered</span></div><div class="stat"><b>'+(S.tot?Math.round(S.ok/S.tot*100):0)+'%</b><span>Accuracy</span></div><div class="stat"><b>'+S.best+'</b><span>Best streak</span></div></div></div>';
 h+='<div class="grid"><button class="mode" onclick="start(\'quick\')"><b>Quick 5</b><span>Micro session for a shift break</span></button>';
 h+='<button class="mode" onclick="start(\'survival\')"><b>Survival</b><span>3 lives. How far can you go?</span></button>';
 h+='<button class="mode" onclick="start(\'all\')"><b>Full bank</b><span>All '+CASES.length+' cases, shuffled</span></button>';
 h+='<button class="mode" onclick="start(\'missed\')"><b>Redo missed ('+S.missed.length+')</b><span>Turn weak spots into wins</span></button></div>';
 h+='<div class="card"><h2>Chapter focus</h2><select id="chsel">';
 CHAPTERS.forEach(function(c){h+='<option>'+c+'</option>'});
 h+='</select><div style="height:8px"></div><button class="btn alt" onclick="start(\'chapter\')">Start chapter drill</button></div>';
 h+='<div class="card"><h2>Chapter mastery</h2>';
 CHAPTERS.forEach(function(c){var x=S.chap[c]||{a:0,o:0};var p=x.a?Math.round(x.o/x.a*100):0;h+='<div class="ch"><span class="n">'+c+'</span><div class="bar"><i style="width:'+p+'%"></i></div><span style="width:34px;text-align:right">'+p+'%</span></div>'});
 h+='<button class="btn alt sm" style="margin-top:10px" onclick="resetAll()">Reset progress</button></div>';
 $("app").innerHTML=h;
}
var rs=0;
function resetAll(){if(!rs){rs=1;pop("Tap again to confirm reset");setTimeout(function(){rs=0},3000);return}rs=0;S={xp:0,best:0,tot:0,ok:0,chap:{},missed:[]};save();home()}
function start(mode){
 var idx=CASES.map(function(_,i){return i});
 if(mode==="chapter"){var c=$("chsel").value;idx=idx.filter(function(i){return CASES[i].c===c})}
 if(mode==="missed"){idx=idx.filter(function(i){return S.missed.indexOf(i)>-1});if(!idx.length){pop("No missed cases yet!");return}}
 idx=shuffle(idx);
 if(mode==="quick")idx=idx.slice(0,5);
 G={mode:mode,q:idx,i:0,lives:3,streak:0,xp:0,perfect:0,t0:0};
 show();
}
function topBar(){
 var h='<div class="row"><button class="btn alt sm" onclick="home()">Home</button><span class="sp"></span>';
 if(G.mode==="survival")h+='<span class="hearts">'+"❤️".repeat(Math.max(G.lives,0))+"🖤".repeat(3-Math.max(G.lives,0))+'</span>';
 h+='<span class="pill">Streak '+G.streak+'</span><span class="pill">+'+G.xp+' XP</span></div>';
 h+='<div class="bar" style="margin:10px 0"><i style="width:'+(G.i/G.q.length*100)+'%"></i></div>';
 return h;
}
function show(){
 if(G.i>=G.q.length||(G.mode==="survival"&&G.lives<=0)){return end()}
 var k=G.q[G.i],c=CASES[k];G.k=k;G.step=1;G.hit=0;G.t0=Date.now();
 var h=topBar()+'<div class="card"><span class="tag">'+c.c+' · '+["","Easy","Medium","Hard"][c.l]+' · Case '+(G.i+1)+'/'+G.q.length+'</span><div class="vig">'+c.v+'</div></div>';
 h+='<div class="card" id="stepbox"></div><div id="after"></div>';
 $("app").innerHTML=h;ask();
}
function ask(){
 var c=CASES[G.k],list=G.step===1?c.d:c.s,right=list[0];
 G.opts=shuffle(list.map(function(t,i){return {t:t,ok:i===0}}));
 var h='<span class="tag">'+(G.step===1?(c.q1||'Step 1 · Most likely diagnosis'):'Step 2 · Next best step')+'</span>';
 G.opts.forEach(function(o,i){h+='<button class="opt" onclick="pick('+i+')">'+o.t+'</button>'});
 $("stepbox").innerHTML=h;G.t0=Date.now();
}
function pick(i){
 var c=CASES[G.k],o=G.opts[i],btns=document.querySelectorAll("#stepbox .opt");
 var secs=(Date.now()-G.t0)/1000;
 btns.forEach(function(b,j){b.disabled=true;if(G.opts[j].ok)b.classList.add("ok")});
 if(!o.ok)btns[i].classList.add("no");
 S.tot++;var cs=S.chap[c.c]||(S.chap[c.c]={a:0,o:0});cs.a++;
 var gain=0;
 if(o.ok){
  S.ok++;cs.o++;G.hit++;G.streak++;if(G.streak>S.best)S.best=G.streak;
  gain=(G.step===1?10:15)+(secs<20?5:0)+Math.min(G.streak-1,5);
  pop("+"+gain+" XP"+(G.streak>2?" 🔥 x"+G.streak:""));
 }else{
  G.streak=0;if(G.mode==="survival")G.lives--;
  if(S.missed.indexOf(G.k)<0)S.missed.push(G.k);
 }
 G.xp+=gain;S.xp+=gain;
 var fb=G.step===1?c.dw:c.sw;
 var h='<div class="fb'+(o.ok?'':' bad')+'"><b>'+(o.ok?'Correct. ':'Not quite. ')+'</b>'+(o.ok?'':'Answer: '+(G.step===1?c.d[0]:c.s[0])+'. ')+fb+'</div>';
 if(G.step===1){h+='<button class="btn" onclick="G.step=2;ask();">Next: best next step</button>';
  var d=document.createElement("div");d.id="fbx";$("stepbox").appendChild(d);d.innerHTML=h;}
 else{
  if(G.hit===2){G.xp+=10;S.xp+=10;G.perfect++;h+='<div class="fb">Perfect case bonus +10 XP</div>'}
  h+='<div class="pearl"><b>High-yield:</b> '+c.p+'</div>';
  var done=(G.mode==="survival"&&G.lives<=0);
  h+='<button class="btn" onclick="G.i++;show()">'+((G.i+1>=G.q.length||done)?'Finish':'Next case')+'</button>';
  var d2=document.createElement("div");d2.id="fbx";$("stepbox").appendChild(d2);d2.innerHTML=h;
 }
 save();
 var hdr=document.querySelector(".pill:last-of-type");
}
function end(){
 var h='<div class="card"><div class="big">'+(G.mode==="survival"&&G.lives<=0?"💀":"🏆")+'</div><h1 style="text-align:center">'+(G.mode==="survival"&&G.lives<=0?"Out of lives":"Session complete")+'</h1>';
 h+='<div class="row" style="margin-top:12px"><div class="stat"><b>'+G.xp+'</b><span>XP earned</span></div><div class="stat"><b>'+G.perfect+'</b><span>Perfect cases</span></div><div class="stat"><b>'+G.i+'</b><span>Cases played</span></div></div>';
 h+='<p class="sub" style="text-align:center">Rank: <b>'+rank()+'</b>. Missed cases are saved in "Redo missed".</p>';
 h+='<button class="btn" onclick="'+(G.mode==="chapter"||G.mode==="missed"?'home()':"start(\\'"+G.mode+"\\')")+'">'+(G.mode==="chapter"||G.mode==="missed"?'Pick another drill':'Play again')+'</button><div style="height:8px"></div><button class="btn alt" onclick="home()">Home</button></div>';
 $("app").innerHTML=h;
}
home();
</script>
</body>
</html>
