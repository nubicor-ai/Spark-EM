 <head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EM Case Arena – Differential + Next Best Step</title>
<style>
:root{--bg:#0f1220;--card:#181c30;--card2:#1f2440;--ink:#eef0ff;--mut:#98a0c8;--acc:#7c5cff;--acc2:#22d3a6;--bad:#ff5d73;--warn:#ffb84d;--line:#2a3058}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:14px 14px 80px}
h1{font-size:22px;margin:6px 0 2px}
h2{font-size:17px;margin:0 0 8px}
.sub{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--mut)}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .5s}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--acc);border:0;border-radius:14px;padding:13px 16px;font-weight:700;width:100%}
.btn.alt{background:var(--card2);border:1px solid var(--line)}
.btn.sm{width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.mode b{display:block}
.mode span{font-size:12px;color:var(--mut)}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--acc2);background:rgba(34,211,166,.14)}
.opt.no{border-color:var(--bad);background:rgba(255,93,115,.14)}
.opt[disabled]{cursor:default}
.vig{font-size:16.5px;line-height:1.55}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.fb{border-left:4px solid var(--acc2);background:var(--card2);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14.5px}
.fb.bad{border-color:var(--bad)}
.pearl{border-left:4px solid var(--warn);background:var(--card2);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14.5px}
.hearts{letter-spacing:2px}
.stat{text-align:center;flex:1;background:var(--card2);border-radius:12px;padding:8px 4px}
.stat b{display:block;font-size:18px}
.stat span{font-size:11px;color:var(--mut)}
.ch{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.ch .n{width:92px;color:var(--mut)}
.ch .bar{flex:1;height:8px}
.pop{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--acc);padding:8px 16px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:all .5s;z-index:9}
.pop.show{opacity:1;top:90px}
.tbar{height:5px;background:var(--card2);border-radius:99px;overflow:hidden;margin-bottom:8px}
.tbar>i{display:block;height:100%;background:var(--warn);width:100%}
select{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;width:100%}
.hide{display:none}
.big{font-size:44px;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="pop" id="pop"></div>
<script>
// ===== CASE BANK (anchored to Rosen's Part I summary: Ch 8-14) =====
// d = diagnosis options (first = correct), s = next-step options (first = correct)
var CASES=[
{c:"Fever",l:1,v:"68M from a nursing home: fever 39.4°C, new confusion, RR 28, HR 124, BP 82/48. Urine is cloudy.",
 d:["Sepsis with septic shock (likely urinary source)","Viral syndrome","Drug fever","Autoimmune flare"],
 dw:"Fever + altered mental status + respiratory distress + hemodynamic instability = the unstable, critically ill febrile adult (Fig 8.1).",
 s:["Rapid resuscitation: airway/O2, cardiac monitor, IV fluids, then broad-spectrum antibiotics (consider antivirals/antifungals)","Complete full history and exam, then order UA/CBC/CXR before treating","Give antipyretic and observe for improvement","Order ANA, RF and ESR"],
 sw:"Unstable febrile = resuscitate first with an abbreviated history/exam. Consider rapid cooling, broad-spectrum antibiotics, antivirals, antifungals. The complete H&P comes after.",
 p:"Unstable = AMS, respiratory distress or hemodynamic instability. Resuscitate BEFORE the complete workup."},
{c:"Fever",l:1,v:"34F, 3 days of fever. Vitals stable, looks well, thorough history and exam find no localizing source.",
 d:["Occult infection (e.g. UTI or pneumonia) - undifferentiated febrile illness","Malignancy","Autoimmune disease","Central fever"],
 dw:"Stable adult, no positive findings: infection is the commonest category, so screen for the usual occult sources first.",
 s:["Consider UA, CBC and CXR","LP and CT abdomen/pelvis now","PPD and blood cultures only","Discharge with no tests"],
 sw:"Fig 8.2: no positive findings -> consider UA, CBC, CXR. If any is positive, go down the 'positive findings' pathway (specific testing, treat or refer).",
 p:"Side box for stable febrile adults: IV rehydration, antipyretics, antiemetics, analgesics."},
{c:"Fever",l:3,v:"Stable adult with fever; UA, CBC, CXR all negative. Reassessed 12 h later: now hypotensive, tachycardic and drowsy.",
 d:["Occult serious infection with clinical deterioration","Resolving viral illness","Autoimmune disease only","Miscellaneous fever"],
 dw:"Negative screen but WORSENED on reassessment moves you to the 'worsened' branch: assume a serious occult infection.",
 s:["Resuscitate, give empirical broad-spectrum antibiotics/antivirals/antifungals; LP, CT abdomen/pelvis, PPD, blood and urine cultures","Watchful waiting and symptomatic treatment","Assign most likely category and consider more testing","Send ANA, RF, ESR only"],
 sw:"Fig 8.2 reassessment: Improved = watchful waiting. Unchanged = pick a category (infectious, autoimmune, malignancy, misc) and test more. Worsened = LP, CT A/P, PPD, cultures + resuscitate + empirical broad cover.",
 p:"Reassess clinical status: improved -> wait; unchanged -> categorize; worsened -> aggressive workup and empirical cover."},

{c:"Weakness",l:2,v:"72M with diabetes: 40 minutes of 'heavy' left arm and sweating. On exam there is no measurable loss of power, no sensory loss, normal face.",
 d:["Myocardial ischemia presenting as arm weakness","Cortical stroke","Radiculopathy","Neuromuscular junction disorder"],
 dw:"Older or diabetic patient with upper-extremity weakness but NO measurable loss of power: think myocardial ischemia (Fig 9.1).",
 s:["12-lead ECG and troponin","MRI brain","Nerve conduction study","Discharge to neurology clinic"],
 sw:"The weakness is a cardiac equivalent. Get the ECG immediately.",
 p:"Unilateral single-limb weakness without a true power deficit in an older or diabetic patient = ischemia until proven otherwise."},
{c:"Weakness",l:2,v:"24F: 4 days of weakness climbing up both legs after a diarrheal illness. Both legs weak (symmetric), reflexes absent, no sensory level, no bladder involvement.",
 d:["Guillain-Barre syndrome","Anterior cord syndrome","Central cord syndrome","Myositis"],
 dw:"Bilateral lower (and all four limbs) weakness: anterior cord, cauda equina or Guillain-Barre. Post-diarrheal, areflexic, ascending and no sensory level points to GBS.",
 s:["Admit with respiratory monitoring (vital capacity/NIF) and neurology input","Reassure and discharge","Start steroids for Bell palsy","Send CK only"],
 sw:"GBS can progress to respiratory failure: admit, track respiratory function, arrange specific therapy with neurology.",
 p:"Bilateral lower limbs: anterior cord, cauda equina, Guillain-Barre. All four limbs: cervical anterior cord, Guillain-Barre."},
{c:"Weakness",l:2,v:"29M, thighs and shoulders too weak to rise from a chair after a marathon. Muscles are tender, urine is dark. Distal strength is normal.",
 d:["Rhabdomyolysis","Cauda equina syndrome","Central cord syndrome","Peripheral neuropathy"],
 dw:"Bilateral PROXIMAL-only weakness: myositis, rhabdomyolysis or NMJ disorder. Exertion + dark urine = rhabdo.",
 s:["Check CK and electrolytes/creatinine, start IV fluids","Urgent MRI spine","Encourage rest and oral fluids, discharge","Give pyridostigmine"],
 sw:"Rhabdo: confirm with CK, look for hyperkalemia and AKI, and hydrate aggressively.",
 p:"Proximal only: myositis, rhabdomyolysis, NMJ disorder. Distal only lower limbs: cauda equina, GBS, chronic polyneuropathy."},

{c:"Cyanosis",l:2,v:"30M on dapsone: SpO2 88% that does not improve with oxygen, normal CXR, no respiratory distress. Blood is chocolate-brown. CO-oximetry: MetHb 28%.",
 d:["Methemoglobinemia","Pulmonary embolism","Tension pneumothorax","ARDS"],
 dw:"Central cyanosis, no response to O2, no respiratory distress, normal-looking lungs + dapsone (a known oxidant) = methemoglobinemia.",
 s:["Methylene blue; stop the offending drug; supportive care","Intubate and raise FiO2","CTPA","Needle decompression"],
 sw:"Give methylene blue if MetHb >20%, or >15% with symptoms. Remove the offending agent.",
 p:"Cyanosis not improving on O2 with normal pulmonary exam: CO-oximetry for MetHb/SulfHb. Pulse-ox is unreliable."},
{c:"Cyanosis",l:1,v:"26F, blue fingers after cold exposure. Pulses are palpable. Fingers turn pink on warming; O2 not needed.",
 d:["Raynaud phenomenon / vasospasm","Arterial embolism","Cardiogenic shock","Methemoglobinemia"],
 dw:"Peripheral cyanosis, warm and improves, pulses intact: vasospasm from environmental exposure.",
 s:["Warm the extremity; consider CCB or topical nitroglycerin; rheumatology referral","IV heparin and vascular surgery","Methylene blue","Thrombolysis"],
 sw:"Vasospasm management: warm the extremity, CCB, topical NTG, rheumatology referral.",
 p:"Peripheral algorithm: give O2, check pulse. Weak/no pulse = embolism/thrombosis."},
{c:"Cyanosis",l:2,v:"66F with atrial fibrillation (off anticoagulation): sudden painful, cold, blue left foot. No dorsalis pedis pulse, no improvement with warming.",
 d:["Acute arterial embolism or thrombosis","Raynaud vasospasm","Hypovolemia","Cold exposure only"],
 dw:"Peripheral cyanosis with a weak/absent pulse and no improvement = arterial occlusion; AF is the embolic source.",
 s:["CTA or ultrasound, immediate vascular surgery consult, IV heparin","Warm blankets and CCB","IV fluid bolus only","Topical nitroglycerin"],
 sw:"Embolism/thrombosis: CTA/US, immediate vascular surgery, IV heparin, intra-arterial thrombolysis or embolectomy.",
 p:"Limb ischemia is time-critical. Start heparin and involve vascular surgery immediately."},
{c:"Cyanosis",l:2,v:"22M, tall and thin, sudden dyspnea and pleuritic pain. SpO2 82%, respiratory distress, absent breath sounds on the right, HR 130, BP 80/50.",
 d:["Tension pneumothorax","Methemoglobinemia","Pulmonary edema","Polycythemia"],
 dw:"Central cyanosis with respiratory distress and a one-sided silent chest = pneumothorax (large R-to-L shunt physiology).",
 s:["Needle decompression, then tube thoracostomy","CTPA","Furosemide and nitroglycerin","Methylene blue"],
 sw:"Pneumothorax: needle decompression then tube thoracostomy. Do not delay for imaging when unstable.",
 p:"Central, respiratory distress + abnormal CXR: pneumothorax, ARDS, large R-to-L shunt."},

{c:"Syncope",l:3,v:"19M collapses during basketball with no prodrome. Systolic murmur louder on Valsalva. ECG: LVH with deep T-wave inversions. Uncle died suddenly aged 40.",
 d:["Hypertrophic cardiomyopathy (cardiac syncope)","Vasovagal syncope","Hypoglycemia","Seizure"],
 dw:"Exertional, no prodrome, family history of sudden death <50, LVH/deep T inversion = HCM.",
 s:["Hospitalize with telemetry, echocardiography and cardiology","Reassure and discharge","Outpatient EEG","Tilt-table test next week"],
 sw:"High-risk syncope (exertional, no prodrome, family history, abnormal ECG) = hospitalize.",
 p:"Short-term risk factors: older age, male, family history of sudden death <50, no prodrome, exertional, supine onset, palpitations before syncope."},
{c:"Syncope",l:1,v:"22F faints after standing in a hot, crowded church. Preceded by nausea, sweating, feeling hot. Normal ECG, exam and vitals, no cardiac history.",
 d:["Vasovagal syncope","Cardiac dysrhythmia","Pulmonary embolism","Subarachnoid hemorrhage"],
 dw:"Classic prodrome with a noxious/warm/standing trigger = vasovagal. Canadian Syncope Risk Score would also subtract points (-1 predisposition, -2 ED diagnosis).",
 s:["Risk stratify: low risk, discharge with reassurance","Admit for MRI brain","CT pulmonary angiogram","Electrophysiology study"],
 sw:"Low risk by gestalt or score (CSRS -2 very low, -1 or 0 low): discharge.",
 p:"CSRS: -2 very low; -1 or 0 low; 1-3 medium; >3 high. Medium = shared decision-making."},
{c:"Syncope",l:3,v:"45M with syncope at rest. ECG shows RBBB-like pattern with ST elevation in V1-V3.",
 d:["Brugada syndrome","Arrhythmogenic RV cardiomyopathy","Short QT syndrome","Pericardial effusion"],
 dw:"RBBB pattern with ST elevation V1-V3 = Brugada. (ARVC has inverted T in right precordial leads + epsilon waves.)",
 s:["Hospitalize on monitor for cardiology/EP risk assessment","Discharge, outpatient follow-up","Reassure; vasovagal","Start CCB"],
 sw:"Syncope with a dysrhythmic ECG substrate is high risk: admit with continuous monitoring.",
 p:"Low voltage or electrical alternans: pericardial effusion. RV strain: PE. WPW: pre-excitation."},
{c:"Syncope",l:2,v:"30F on oral contraceptives: syncope, pleuritic chest pain, HR 118, SpO2 91%. ECG: RV strain pattern.",
 d:["Pulmonary embolism","Vasovagal syncope","HCM","Aortic stenosis"],
 dw:"Syncope + tachycardia, hypoxemia, pleuritic pain, RV strain = PE (cardiopulmonary cause).",
 s:["CTPA (or V/Q if CTPA unavailable/contraindicated), then LMWH or IV heparin","Discharge with reassurance","Tilt-table test","Start nitrates"],
 sw:"PE: CTPA or V/Q, LMWH or heparin infusion, consider thrombolysis if unstable.",
 p:"Critical syncope diagnoses (Box 11.5): MI, dysrhythmia, dissection, AS, HCM, tamponade, ruptured AAA, massive PE, SAH, ectopic, sepsis."},
{c:"Syncope",l:2,v:"28F with syncope, lower abdominal pain and a missed period. HR 122, BP 84/50, pale.",
 d:["Ruptured ectopic pregnancy","Vasovagal syncope","Orthostatic hypotension from medication","Seizure"],
 dw:"Syncope with hypovolemic shock in a woman of childbearing age with pain + amenorrhea = ruptured ectopic (hemorrhage group).",
 s:["Resuscitate, bedside ultrasound, urgent OB/GYN","Discharge after fluids","CT head","Holter monitor"],
 sw:"Unstable: resuscitate first (Fig 11.2). Hemorrhage causes include GI bleed, ruptured spleen, ovarian cyst, AAA, ectopic, trauma.",
 p:"Fig 11.2: unstable -> resuscitate; stable -> ECG, history, exam."},
{c:"Syncope",l:1,v:"82F faints on standing up. Started a nitrate and a diuretic last week. Supine BP 140/80, standing 96/60.",
 d:["Medication-induced orthostatic hypotension","Brugada syndrome","Pulmonary embolism","Seizure"],
 dw:"Vasodilators (nitrates) and diuretics are classic offenders in Box 11.4. Volume depletion + vasodilation = orthostasis.",
 s:["Review and adjust culprit medications, check volume status","Start an antiarrhythmic","Order EEG","Start anticoagulation"],
 sw:"Orthostatic group: volume depletion, autonomic failure, medications.",
 p:"Box 11.4 classes: vasodilators, diuretics, central antihypertensives, QT-prolonging, psychoactive, others."},

{c:"Coma",l:2,v:"40M found unresponsive. RR 6, pinpoint pupils, SpO2 84%, glucose 110.",
 d:["Opioid toxicity","Brainstem stroke","Hypoglycemia","Nonconvulsive status"],
 dw:"Depressed consciousness + pinpoint pupils + respiratory depression = opioid toxicity.",
 s:["ABC with ventilatory support, then naloxone","CT head first","IV thiamine only","Start antibiotics and LP"],
 sw:"Fig 12.2: ABC first. Dextrose if hypoglycemic, naloxone if opioid suspected, thiamine if malnourished.",
 p:"Neuroprotective: SpO2 94-97%, avoid hypoxia/hyperoxia, hypotension, hyperthermia; head of bed 30 degrees."},
{c:"Coma",l:1,v:"55M with alcohol use disorder, malnourished, found unresponsive. Fingerstick glucose 32 mg/dL.",
 d:["Hypoglycemia","Opioid overdose","PRES","Brainstem stroke"],
 dw:"The fingerstick explains the coma: always check glucose in any depressed consciousness.",
 s:["IV dextrose plus thiamine","Immediate CT head","Naloxone","Start antibiotics"],
 sw:"Give dextrose if hypoglycemic and thiamine if malnourished (give thiamine so you do not precipitate Wernicke).",
 p:"Diagnosis and monitoring bundle: glucose, IV access, SpO2, monitor, ECG, portable CXR, POC labs."},
{c:"Coma",l:3,v:"62M with hypertension: acute coma, dysconjugate gaze, pinpoint but reactive pupils, quadriparesis. Glucose normal, no opioid signs.",
 d:["Brainstem/basilar artery event","Metabolic encephalopathy","Toxic ingestion","Hypoglycemia"],
 dw:"Coma with brainstem signs and no toxic or metabolic explanation points to a structural brainstem lesion.",
 s:["Secure airway if not improving; CT + CTA, then specialist consult and ICU","MRI first, then decide","LP","Observe on the ward"],
 sw:"Fig 12.2: brainstem signs = CT + CTA. No brainstem signs = CT. Structural cause = specialist consult, treat cause, neuroprotective care, ICU.",
 p:"TOXIC PINES: Toxic, Seizure, PRES, Infection, Nutrition, Endocrine (after structural cause excluded)."},
{c:"Coma",l:3,v:"45F with headache and visual loss, then a seizure and persistent stupor. BP 220/130. CT head is normal.",
 d:["PRES (posterior reversible encephalopathy)","Hypothyroid coma","Opioid toxicity","Wernicke encephalopathy"],
 dw:"No structural cause on CT: run TOXIC PINES. Severe hypertension + visual loss + seizure = PRES.",
 s:["MRI brain and controlled antihypertensive therapy","LP and antibiotics","Thyroid studies and steroids","Naloxone"],
 sw:"PINES: PRES -> MRI, antihypertensive. (T: labs/antidote/dialysis; S: EEG/anticonvulsant; I: LP/antibiotics; N: thiamine/glucose; E: thyroid/steroids.)",
 p:"After a negative CT, work through TOXIC PINES systematically."},

{c:"Confusion",l:2,v:"70M, post-op day 2: fluctuating attention, pulling at lines, RASS +2. Delirium Triage Screen is positive. He is endangering himself.",
 d:["Delirium (acute confusion)","Dementia only","Primary psychosis","Wernicke only"],
 dw:"Altered consciousness (RASS not 0) = DTS positive, confirm with bCAM; fluctuating attention = delirium.",
 s:["Haloperidol 1-5 mg IV/IM (or atypical antipsychotic) while treating critical causes; avoid restraints","Physical restraints and observe","Discharge","Large-dose benzodiazepine only"],
 sw:"Management: supportive (quiet, family/1:1 sitter, avoid restraints). If immediate sedation is needed: haloperidol 1-5 mg IV/IM. Treat critical causes (O2, glucose, antidotes).",
 p:"Critical causes of confusion: hypoxia, hypoventilation, hypoglycemia, delirium tremens."},
{c:"Confusion",l:2,v:"Patient has RASS 0. You ask: 'Spell LUNCH backwards.' He makes 2 errors.",
 d:["Delirium Triage Screen POSITIVE","Delirium Triage Screen negative","Not delirious: dementia only","Not assessable"],
 dw:"RASS 0 then 'spell LUNCH backwards': 0-1 errors negative, more than 1 error positive.",
 s:["Confirm with the brief CAM (bCAM)","Reassure and discharge","Start haloperidol immediately","Request CT head"],
 sw:"A positive DTS is confirmed with bCAM (altered mental status or fluctuating course, then further steps).",
 p:"RASS not 0 = DTS positive straight away -> bCAM."},
{c:"Confusion",l:3,v:"75M with COPD: drowsy and confused, RR 8, SpO2 80% on room air.",
 d:["Hypoxia and hypoventilation (critical cause)","Hypertensive encephalopathy","Uremia","Sedative toxicity"],
 dw:"Hypoxia and hypoventilation are the first 'critical' causes of confusion (Box 13.1).",
 s:["Oxygen and ventilatory support while checking glucose","Haloperidol","CT head before anything","Wait for lab results"],
 sw:"Treat critical causes first: oxygen, glucose, specific antidotes. Then continue the systematic workup.",
 p:"Box 13.1 emergent: seizures, TBI, hypertensive encephalopathy, sepsis, hepatic encephalopathy, uremia, endocrine, toxins, withdrawal."},

{c:"Seizure",l:1,v:"Convulsion has lasted 5 minutes in the ED. Airway positioned, O2 on, glucose 96 mg/dL. IV access is in place.",
 d:["Status epilepticus","Syncope with jerking","Psychogenic nonepileptic event","Hypoglycemic seizure"],
 dw:"Ongoing convulsion for 5 minutes = status epilepticus (critical).",
 s:["IV lorazepam 2-4 mg (max 10), or diazepam 5 mg or midazolam 5-10 mg IM","IV phenytoin first","IV propofol infusion","Wait and observe"],
 sw:"Fig 14.3 first-line: diazepam 5 mg (max 20), lorazepam 2-4 mg (max 10), midazolam 5-10 mg IV/IM/intranasal. Ensure adequate dosing (0.1 mg/kg).",
 p:"Initial: ABCs, pulse oximetry, ECG, fingerstick (dextrose if <60), lateral decubitus."},
{c:"Seizure",l:2,v:"Seizure continues after an adequate benzodiazepine dose (0.1 mg/kg lorazepam).",
 d:["Benzodiazepine-refractory status epilepticus","Psychogenic seizure","Resolved seizure","Syncope"],
 dw:"Persisting after adequate benzodiazepine = established status epilepticus.",
 s:["Second-line: levetiracetam 60 mg/kg (max 4500 mg) IV over 10 min (or valproate 40 mg/kg, fosphenytoin 20 PE/kg, phenytoin 20 mg/kg, lacosamide 200-400 mg)","Repeat benzodiazepine forever","Intubate and start pentobarbital","Discharge"],
 sw:"Fig 14.3 second-line: levetiracetam, lacosamide (limited data), phenytoin 20 mg/kg at max 50 mg/min or fosphenytoin 20 PE/kg at 150 mg/min, valproate 40 mg/kg over 10 min.",
 p:"Phenytoin: max rate 50 mg/min. Fosphenytoin: 150 mg/min."},
{c:"Seizure",l:3,v:"Seizure persists after benzodiazepine AND a second-line agent.",
 d:["Refractory status epilepticus","Eclampsia only","Psychogenic","Resolved"],
 dw:"Failure of benzodiazepine + second-line = refractory status epilepticus.",
 s:["Third-line with intubation and EEG: ketamine, midazolam, pentobarbital or propofol infusion","Give a third non-sedating oral drug","Discharge with neurology follow-up","Stop treatment"],
 sw:"Fig 14.3 third-line: ketamine 1.5 mg/kg IV (infusion 1.2-7.5 mg/kg/h), midazolam 0.2 mg/kg (0.1-2.9 mg/kg/h), pentobarbital 5 mg/kg (0.5-10 mg/kg/h), propofol 2 mg/kg (30-200 mcg/kg/min).",
 p:"If not back to baseline after seizure stops, consider nonconvulsive status."},
{c:"Seizure",l:2,v:"Known epileptic on phenytoin: typical brief seizure, now back to baseline. Phenytoin level is subtherapeutic.",
 d:["Breakthrough seizure from subtherapeutic antiseizure drug level","First-time seizure","Status epilepticus","Syncope"],
 dw:"Same as prior seizures, low drug level: a breakthrough seizure.",
 s:["Load the antiseizure drug, then discharge with outpatient follow-up","CT, LP and admit","Intubate","Start benzodiazepine infusion"],
 sw:"Fig 14.2 not first-time & same as prior: check ASD level and lowering factors; load if subtherapeutic; discharge if back to baseline.",
 p:"If different from prior seizures, use the first-time pathway."},
{c:"Seizure",l:2,v:"62M, first-ever seizure. Back to baseline but with mild right-arm weakness (focal finding). Glucose, electrolytes normal.",
 d:["First-time symptomatic seizure (structural lesion until proven otherwise)","Breakthrough seizure","Syncope","Psychogenic spell"],
 dw:"First seizure, age >40 and a focal exam: structural brain disease is likely.",
 s:["CT head in the ED plus glucose, electrolytes, LFTs, alcohol level, drug screen","Discharge, outpatient CT next month","EEG only","Observe, no imaging"],
 sw:"Fig 14.2 first-time seizure with focal exam or immunosuppression: CT in the ED. Box 14.1 prompts neuroimaging for age >40, coma, immunocompromise, clotting disorders, malignancy, trauma and more.",
 p:"Box 14.1: age >40, coma, immunocompromised, clotting disorder, prior ICH, malignancy, thunderclap headache, SE of unclear cause, neurocutaneous stigmata, trauma."},
{c:"Seizure",l:3,v:"34-week pregnant woman has a generalized seizure. BP 170/112, headache, edema, 3+ proteinuria.",
 d:["Eclampsia","Epilepsy breakthrough","Hypoglycemia","Vasovagal syncope"],
 dw:"Seizure in pregnancy with hypertension and proteinuria: eclampsia, one of the seizures needing specialized treatment (Box 14.3).",
 s:["IV magnesium sulfate, control BP and arrange urgent obstetric delivery planning","Phenytoin load only","Observe","Dextrose bolus"],
 sw:"Seizures needing specific treatment: eclampsia, toxic ingestion (isoniazid, lithium, TCAs), hypoglycemia, hyponatremia, hypocalcemia, raised ICP.",
 p:"Box 14.3 critical: status epilepticus (convulsive/nonconvulsive) and seizures requiring specialized treatment."},
{c:"Seizure",l:2,v:"20M faints at a blood draw, stiffens and has 10 seconds of jerking, wakes within a minute and is fully alert with no post-ictal period.",
 d:["Syncope with convulsive jerks (vasovagal)","Generalized epilepsy","Stroke","Meningoencephalitis"],
 dw:"Brief jerks after a trigger-induced faint with immediate recovery are a syncope mimic of seizure. Seizure differential includes vasovagal and cardiogenic syncope.",
 s:["Check ECG/vitals and glucose, risk stratify as syncope","Load antiseizure drug","CT and LP","Admit for EEG monitoring"],
 sw:"History decides it: aura, abrupt onset, non-suppressible shaking and a postictal state suggest seizure. This has none of them.",
 p:"Box 14.2 differential: cardiac, neurologic, toxicologic, metabolic, infectious, psychiatric."},

/* ===== Added from photos: Table 8.1, Table 9.1, Table 12.1, GCS ===== */
{c:"Fever",l:2,v:"19M in a dorm: fever 39.8, severe headache, neck stiffness, petechial rash, HR 130, BP 80/50.",
 d:["Meningococcemia / sepsis with meningitis (critical diagnoses)","Influenza","Cystitis","Pharyngitis"],
 dw:"Table 8.1 critical diagnoses: sepsis or septic shock and meningococcemia (systemic), meningitis (neurologic).",
 s:["Resuscitate (O2, monitor, IV fluids) and give empiric broad-spectrum antibiotics; consider CSF evaluation for headache/meningismus","Antipyretic and oral fluids","Rapid influenza swab and discharge","Wait for CT and LP results before any treatment"],
 sw:"Hypotensive febrile adult = unstable (Fig 8.1): resuscitate and cover empirically. CSF evaluation should be considered with mental status change, headache or meningismus.",
 p:"Table 8.1 critical: pneumonia with respiratory failure, peritonitis, meningitis, cavernous sinus thrombosis, sepsis/septic shock, meningococcemia. Treat temperature >41 C with antipyretics."},
{c:"Fever",l:2,v:"84F brought by her daughter: 'not herself', two falls, temp 38.1, HR 108, RR 24. No dysuria, no cough.",
 d:["Occult serious infection (urinary or pneumonia) with atypical presentation in the elderly","Normal aging","Anxiety disorder","Medication side effect"],
 dw:"In older adults, UTI or pneumonia may present only with a change in mental status, falls or functional decline; dysuria, flank pain and cough are often absent.",
 s:["Treat as high risk: full vitals, collateral baseline from family, UA, CXR, cultures; low threshold to admit","Reassure; low-grade fever is benign","Discharge with antipyretic","Psychiatric referral"],
 sw:"Significant tachypnea or hypotension may portend a severe course. Family members are an important source of baseline function. Older patients may not mount a febrile response.",
 p:"Recent antipyretic use can mask fever. Cancer with recent chemo/radiation suggests leukopenia or immunosuppression."},
{c:"Fever",l:2,v:"62M with a prosthetic aortic valve: 5 days of fever and a new murmur.",
 d:["Infective endocarditis","Viral URI","Cystitis","Appendicitis"],
 dw:"Endocarditis is an emergent cardiovascular infection (Table 8.1). Prosthetic valves or indwelling devices may be critical to the diagnosis.",
 s:["Blood cultures, then hospitalize with empirical antibiotics","Oral antibiotics and discharge","Antipyretic only","Send ESR only"],
 sw:"A patient ill enough to need blood cultures from the ED generally requires hospitalization and empirical antibiotic coverage.",
 p:"Table 8.1 emergent CV: endocarditis, pericarditis. Emergent GI: appendicitis, cholecystitis, diverticulitis, intra-abdominal abscess."},

{c:"Weakness",l:2,v:"30F with droopy eyelids and double vision worse at day's end, now short of breath after a chest infection. No sensory loss.",
 d:["Myasthenic crisis (neuromuscular junction)","Guillain-Barre syndrome","Central cord syndrome","Brainstem stroke"],
 dw:"Weakness with no sensory deficit points to the NMJ. Myasthenic or cholinergic crisis is a critical NMJ diagnosis (Table 9.1).",
 s:["Assess respiratory function and airway, prepare for ventilatory support, admit to a monitored setting","Reassure, outpatient neurology","MRI lumbar spine","Treat as Bell palsy"],
 sw:"Respiratory muscle failure is the threat. Critical NMJ causes: myasthenic/cholinergic crisis, botulism, tick paralysis, organophosphate poisoning.",
 p:"Table 9.1 critical: CVA (cortex, brainstem), cord ischemia/compression, GBS, NMJ (4 causes), rhabdomyolysis."},
{c:"Weakness",l:1,v:"6-year-old with 2 days of ascending weakness and unsteadiness; a tick is found behind her ear.",
 d:["Tick paralysis","Rhabdomyolysis","Cauda equina syndrome","Cortical stroke"],
 dw:"Tick paralysis is a critical NMJ cause of weakness (Table 9.1).",
 s:["Find and remove the tick; monitor breathing and neurologic status","MRI brain","Start steroids","Discharge, no examination of skin needed"],
 sw:"Always look for the tick (scalp, behind ears) in ascending weakness. Removal is the treatment.",
 p:"Critical NMJ list: myasthenic or cholinergic crisis, botulism, tick paralysis, organophosphate poisoning."},
{c:"Weakness",l:3,v:"58M with cancer: back pain, bilateral leg weakness, urinary retention and saddle numbness.",
 d:["Spinal cord/cauda equina compression (disc, abscess, hematoma, tumor)","Guillain-Barre syndrome only","Myositis","Bell palsy"],
 dw:"Bilateral lower-extremity weakness: anterior cord, cauda equina or GBS (Fig 9.1). Compression is a critical spinal cord diagnosis (Table 9.1).",
 s:["Emergent MRI spine and neurosurgical consultation","NSAIDs and discharge","EMG next week","CK only"],
 sw:"Cord compression (disc, abscess, hematoma) and ischemia are critical causes; time to decompression matters.",
 p:"Emergent cord causes: transverse myelitis (demyelination), compression (disc, spondylosis)."},
{c:"Weakness",l:2,v:"74M with sudden right arm and leg weakness, right facial droop and aphasia.",
 d:["Cortical/subcortical stroke (ischemic or hemorrhagic)","Brown-Sequard syndrome","Peripheral neuropathy","Rhabdomyolysis"],
 dw:"Unilateral arm, hand and leg weakness with ipsilateral face: cortex, corona radiata or internal capsule (Fig 9.1).",
 s:["Emergent noncontrast CT head; thrombolysis or clot retrieval if eligible","Observe overnight without imaging","CK","Nerve conduction study"],
 sw:"CVA (ischemic or hemorrhagic) is the critical diagnosis. CT without contrast first to exclude hemorrhage.",
 p:"Contralateral face with other CN deficits: brainstem. No face involvement: medial cortex, discrete CST lesion or Brown-Sequard."},

{c:"Coma",l:2,v:"38F, long-term steroid use stopped abruptly: BP 78/45, weight loss, hyperpigmentation, glucose 40, obtunded.",
 d:["Adrenal crisis","Myxedema coma","Thyrotoxic crisis","Opioid toxicity"],
 dw:"Weakness, weight loss, hypotension and hyperpigmentation = adrenal crisis (Table 12.1).",
 s:["D5NS volume repletion, correct hypoglycemia, hydrocortisone 100 mg IV","Levothyroxine alone","Propranolol","Naloxone"],
 sw:"Treatment: D5NS volume repletion, correct hypoglycemia, hydrocortisone 100 mg IV. Expect hyperkalemia as well.",
 p:"Pituitary apoplexy: sudden headache, visual impairment, multihormonal dysfunction -> correct electrolytes, hydrocortisone 100 mg IV, consult neurosurgery."},
{c:"Coma",l:3,v:"68F, lethargic after pneumonia: sluggish, periorbital edema, thinning hair, constipation, goiter, hypothermia.",
 d:["Myxedema coma","Thyrotoxic crisis","Adrenal crisis only","Hepatic encephalopathy"],
 dw:"Sluggishness, weight gain, edema, depression, hair loss, constipation; goiter with depressed consciousness suggests myxedema coma or thyroid storm.",
 s:["Levothyroxine or liothyronine plus hydrocortisone 100 mg IV","Propylthiouracil","Dextrose only","Naloxone"],
 sw:"Often precipitated by acute illness. Treat adrenal insufficiency too (hydrocortisone) before/with thyroid hormone.",
 p:"Thyrotoxic crisis: fever, tachycardia, diaphoresis, diarrhea -> isotonic fluid, propranolol 1 mg IV, PTU 600 mg PO starting dose; may also need adrenal insufficiency treated."},
{c:"Coma",l:2,v:"35F with Graves disease: fever 40, HR 160, diaphoresis, diarrhea, agitation then obtundation.",
 d:["Thyrotoxic crisis (thyroid storm)","Heat stroke","Serotonin syndrome","Sepsis only"],
 dw:"Fever, tachycardia, diaphoresis and diarrhea in a thyroid patient = thyrotoxic crisis.",
 s:["Isotonic fluid, propranolol 1 mg IV, propylthiouracil 600 mg PO starting dose","Levothyroxine","Haloperidol","Cooling only"],
 sw:"Table 12.1 thyrotoxic crisis: isotonic fluid; propranolol 1 mg IV (or PO); PTU 600 mg PO starting dose; may also need to treat adrenal insufficiency.",
 p:"Treat the precipitant too (infection, etc.)."},
{c:"Coma",l:1,v:"75M, alone in a hot apartment: temperature 42 C, hot flushed skin, dehydrated, unresponsive.",
 d:["Heat stroke","Myxedema coma","Opioid toxicity","Adrenal crisis"],
 dw:"Hyperpyrexia >41.1 C, flushing, exertion/heat exposure, dehydration; classic in older adults unable to seek a cool environment.",
 s:["Isotonic fluid and evaporative cooling","Acetaminophen only","Naloxone","Antibiotics and LP only"],
 sw:"Table 12.1: isotonic fluid and evaporative cooling.",
 p:"High altitude cerebral edema: rapid ascent, headache, confusion, psychosis (>3500 m) -> rapid descent, hyperbaric oxygen, dexamethasone 10 mg IV."},
{c:"Coma",l:2,v:"50M with alcohol use disorder: confusion, bilateral nystagmus, sixth-nerve palsy and an ataxic gait.",
 d:["Wernicke encephalopathy","Hepatic encephalopathy","Hyponatremia","Opioid toxicity"],
 dw:"CN III or VI palsy, nystagmus, sluggish pupils, gait instability, peripheral neuropathy in a malnourished/alcoholic patient.",
 s:["Thiamine 500 mg IV","Oral thiamine 100 mg","Lactulose","Observe only"],
 sw:"Table 12.1 Wernicke: thiamine 500 mg IV. Seldom seen in hyperemesis gravidarum.",
 p:"Hepatic encephalopathy: lactulose or rifaximin; evaluate for sepsis, GI bleed, spontaneous bacterial peritonitis."},
{c:"Coma",l:3,v:"Firefighter-rescued 40M from a house fire: collapse, seizure, severe lactic acidosis, soot in the mouth. SpO2 looks normal.",
 d:["Cyanide toxicity (histotoxic hypoxia) with possible CO","Methemoglobinemia","Anaphylaxis","Hypoglycemia"],
 dw:"Confusion, seizure, collapse after combustion of plastics: consider cyanide in any house or car fire (Table 12.1).",
 s:["100% oxygen plus hydroxocobalamin 70 mg/kg (5 g) IV","Methylene blue 1-2 mg/kg","Antibiotics","Naloxone"],
 sw:"Histotoxic hypoxia: 100% oxygen; hydroxocobalamin 70 mg/kg (or 5 g) IV for cyanide.",
 p:"Carbon monoxide: 100% oxygen, hyperbaric oxygen per toxicology (consider especially in pregnancy). Methemoglobinemia: 100% oxygen, methylene blue 1-2 mg/kg IV."},
{c:"Coma",l:2,v:"Winter, a whole family has headache, confusion, malaise and nausea. A fuel heater runs in a closed room.",
 d:["Carbon monoxide poisoning","Influenza","Food poisoning","Meningitis"],
 dw:"Combustion of fuel in an enclosed space with multiple people affected = CO.",
 s:["100% oxygen; consider hyperbaric oxygen per toxicology","Oral fluids and antiemetic","Naloxone","Antibiotics"],
 sw:"Table 12.1: 100% oxygen; hyperbaric oxygen per toxicology, especially in pregnancy.",
 p:"Simple asphyxiants (CO2, nitrogen, helium, argon, methane in enclosed spaces): 100% oxygen."},
{c:"Coma",l:3,v:"Overdose with bradycardia 38, BP 70/40, glucose 48 and a seizure. Pill bottle: metoprolol.",
 d:["Beta-blocker toxicity","Clonidine toxicity","Opioid toxicity","Salicylate toxicity"],
 dw:"Bradycardia, hypotension, hypoglycemia and seizure = beta-blocker (clonidine causes bradycardia, hypotension, somnolence).",
 s:["Isotonic fluid, glucagon 5 mg IV, atropine 0.5 mg IV, vasopressors, high-dose insulin; consider lipid rescue/ECMO","Naloxone only","Atropine only and observe","Flumazenil"],
 sw:"Table 12.1: glucagon 5 mg IV, atropine 0.5 mg IV, vasopressors, high-dose insulin infusion, transcutaneous or transvenous pacing; lipid rescue and ECMO with toxicology.",
 p:"Clonidine: isotonic fluids, vasopressors; discuss naloxone with toxicology."},
{c:"Coma",l:2,v:"Amitriptyline overdose: BP 80/50, wide QRS on ECG, now seizing.",
 d:["Tricyclic antidepressant toxicity","Serotonin syndrome","Anticholinergic crisis only","Opioid toxicity"],
 dw:"Hypotension, wide QRS and seizures = TCA (psychiatric medications, Table 12.1).",
 s:["High-dose IV sodium bicarbonate","Flumazenil","Physostigmine","Atropine"],
 sw:"TCA overdose: high-dose IV sodium bicarbonate. Avoid flumazenil with proconvulsant drugs (cyclic antidepressants, isoniazid).",
 p:"Sedatives: supportive; flumazenil for benzodiazepine toxicity but avoid in chronic benzodiazepine users."},
{c:"Coma",l:3,v:"Chronic alprazolam user found comatose beside empty amitriptyline and alprazolam bottles. RR 8.",
 d:["Mixed sedative (benzodiazepine) and cyclic antidepressant toxicity","Opioid toxicity","Hypoglycemia","Wernicke encephalopathy"],
 dw:"Empty pill bottles of a sedative and a cyclic antidepressant: mixed ingestion.",
 s:["Airway and supportive care; avoid flumazenil","Give flumazenil 0.5 mg now","Naloxone","Physostigmine"],
 sw:"Avoid flumazenil in chronic benzodiazepine users and in patients with proconvulsant drugs on board (cyclic antidepressants, isoniazid).",
 p:"EMS and family may give clues: empty pill bottles, syringes, transdermal patches."},
{c:"Coma",l:2,v:"Ingestion of an unknown liquid: nausea, vomiting, vision changes, intoxicated look. Osmolar gap raised, then an anion gap acidosis develops.",
 d:["Toxic alcohol poisoning","Salicylate toxicity","Opioid toxicity","DKA"],
 dw:"Vision changes with early osmolar gap then anion gap acidosis and renal failure = toxic alcohols.",
 s:["Fomepizole 15 mg/kg load, correct electrolytes, isotonic fluid; consult nephrology/toxicology for hemodialysis","Naloxone","Thiamine only","Activated charcoal and discharge"],
 sw:"Table 12.1: fomepizole 15 mg/kg load; isotonic fluid 500 mL/h; hemodialysis for elevated levels and metabolic acidosis.",
 p:"Optic disc hyperemia is a finding in severe methanol poisoning."},
{c:"Coma",l:2,v:"Delirium, tinnitus, hyperpnea, nausea and vomiting. ABG: anion gap metabolic acidosis with respiratory alkalosis. She took wintergreen oil.",
 d:["Salicylate toxicity","Methanol poisoning","Opioid toxicity","Thyrotoxic crisis"],
 dw:"Tinnitus, delirium, hyperpnea with mixed anion gap acidosis and respiratory alkalosis = salicylates (may come from oil of wintergreen).",
 s:["Isotonic fluid, urinary alkalinization with sodium bicarbonate, correct hypokalemia; consider hemodialysis","Naloxone","Flumazenil","Beta blocker"],
 sw:"Table 12.1: sodium bicarbonate alkalinization, correct hypokalemia, consider hemodialysis.",
 p:"Source may be non-aspirin (oil of wintergreen)."},
{c:"Coma",l:3,v:"28M started tramadol on top of an SSRI: hyperthermia, tremor, ocular clonus, hyperreflexia, diarrhea. No rigidity.",
 d:["Serotonin syndrome","Neuroleptic malignant syndrome","Anticholinergic toxicity","Heat stroke"],
 dw:"Multiple serotonergic agents, hypertension, tachycardia, hyperreflexia, tremor, diarrhea and clonus = serotonin syndrome. NMS has rigidity and elevated CPK.",
 s:["Stop the agents, isotonic fluid, check CPK, benzodiazepines, cooling, hydration, cyproheptadine","Bromocriptine","Physostigmine","Haloperidol"],
 sw:"Serotonin syndrome: benzodiazepines, cooling, cyproheptadine; pharmacologic paralysis with a nondepolarizing agent if severe. NMS: cooling, isotonic fluid, benzodiazepines, bromocriptine.",
 p:"NMS: hyperpyrexia, muscular rigidity, delirium, autonomic instability, elevated CPK."},
{c:"Coma",l:2,v:"Agitated 22M after drug use: temperature 39.5, dilated pupils, urinary retention, visual hallucinations, dry skin. ECG normal.",
 d:["Anticholinergic toxicity","Opioid toxicity","Serotonin syndrome","Thyrotoxic crisis"],
 dw:"Hyperpyrexia, pupillary dilation, urinary retention and visual hallucinations = anticholinergic.",
 s:["Supportive care and benzodiazepines; physostigmine only if severe and no seizure, bradycardia or abnormal QRS/QTc","Naloxone","Flumazenil","Haloperidol"],
 sw:"Physostigmine: slow IV push over 5 minutes; avoid if seizure, bradycardia, or abnormal QRS or QTc.",
 p:"Miosis: opioids, clonidine, organophosphates. Mydriasis: cocaine, amphetamines, anticholinergics, TCAs."},
{c:"Coma",l:2,v:"68F on a thiazide: progressive confusion, headache, anorexia, then a seizure. Sodium 112 mEq/L.",
 d:["Hyponatremia","Hypercalcemia","Uremia","Hyperammonemia"],
 dw:"Progressive confusion, headache, anorexia and seizure with a medication side effect = hyponatremia.",
 s:["Hypertonic saline for seizure; otherwise free water restriction","Rapid isotonic saline bolus and furosemide only","Phenytoin load only","Thiamine"],
 sw:"Table 12.1: free water restriction; hypertonic saline for seizures.",
 p:"Hypercalcemia: isotonic fluid, IV bisphosphonates, calcitonin. Hyperammonemia: hemodialysis; levocarnitine for valproate toxicity."},
{c:"Coma",l:3,v:"Sudden headache, visual loss, hypotension and hyponatremia in a 52M. MRI shows a pituitary adenoma hemorrhage.",
 d:["Pituitary apoplexy","Adrenal crisis from adrenal gland","Myxedema coma","Cavernous sinus thrombosis"],
 dw:"Sudden headache, visual impairment and multihormonal dysfunction = pituitary apoplexy.",
 s:["Treat electrolytes, hydrocortisone 100 mg IV, consult neurosurgery","Sodium restriction only","Levothyroxine only","Tissue plasminogen activator"],
 sw:"Table 12.1: treat electrolyte abnormalities; hydrocortisone 100 mg IV; may have pituitary adenoma, consult neurosurgery.",
 p:"Adrenal crisis: D5NS volume repletion and hydrocortisone 100 mg IV."},
{c:"Coma",l:2,v:"66M with sudden right hemiparesis and aphasia 90 minutes ago. Noncontrast CT: no hemorrhage. No contraindications to thrombolysis.",
 d:["Cortical infarct (ischemic stroke)","Intracranial hemorrhage","Cerebellar infarct","Hypoglycemia"],
 dw:"Sudden unilateral neurologic deficits with a CT that excludes hemorrhage = ischemic infarct.",
 s:["tPA 0.9 mg/kg IV (max 90 mg): 10% bolus over 1 min, remainder over 60 min; consider intra-arterial clot retrieval","Aspirin and observe","Heparin infusion","Wait 24 h and get MRI"],
 sw:"Table 12.1: exclude tPA contraindications; tPA 0.9 mg/kg, max 90 mg; control blood pressure. Intracranial hemorrhage: CT, reverse anticoagulation, BP control, early neurosurgery.",
 p:"Cerebellar infarct: sudden vertigo, nausea, ataxia, dysarthria; neurosurgery if severe edema for decompressive craniectomy. Basilar occlusion: risk of locked-in syndrome."},
{c:"Coma",l:2,v:"Older adult with worsening renal function repeatedly drops glucose after dextrose boluses; intentional overdose suspected.",
 d:["Sulfonylurea toxicity","Opioid toxicity","Adrenal crisis","Insulin pump malfunction only"],
 dw:"Older adult with worsening renal function and intentional overdose: hypoglycemic agent toxicity. Sulfonylureas can be lethal with a single pill in children.",
 s:["Dextrose; octreotide if hypoglycemia is refractory","Insulin infusion","Naloxone","Observe without glucose checks"],
 sw:"Table 12.1: dextrose; octreotide if refractory hypoglycemia due to sulfonylurea toxicity.",
 p:"Hypoglycemia (critical): D50W 50 mL IV. Hyperglycemia (DKA, HHS): isotonic fluid, insulin."},
{c:"Coma",l:2,v:"Eyes open only to pain, speaks only incomprehensible sounds, and extends the arm to pain (GCS components).",
 q1:"Step 1 · Calculate the GCS",
 d:["GCS 6 (E2 V2 M2)","GCS 9 (E2 V3 M4)","GCS 8 (E2 V2 M4)","GCS 5 (E1 V2 M2)"],
 dw:"Eye to pain = 2; incomprehensible sounds = 2; extension to pain = 2. Total 6. (Eye: 4 spontaneous, 3 voice, 2 pain, 1 none. Verbal: 5 oriented, 4 confused, 3 inappropriate words, 2 sounds, 1 none. Motor: 6 obeys, 5 localizes, 4 withdraws, 3 flexion, 2 extension, 1 none.)",
 s:["Secure the airway, treat reversible causes, CT head, neuroprotective resuscitation","Observe on the ward","Discharge","Repeat neurologic exam in 24 h"],
 sw:"Fig 12.2: ABC first; secure the airway if not improved; CT (plus CTA with brainstem signs).",
 p:"FOUR score: eye, motor, brainstem reflexes, respiration, each 0-4. It can be used when verbal response cannot be tested (intubated)."},

/* ===== Batch 3: Ch13 tables, Ch14 tables/doses, Ch15 Vertigo, Ch16 Headache ===== */
{c:"Confusion",l:2,v:"72M: confusion started over hours, fluctuating alertness, visual hallucinations, disoriented, can't hold attention. HR 112, temp 38.4.",
 d:["Delirium","Primary psychiatric disorder","Dementia","Vascular dementia"],
 dw:"Table 13.2: delirium = acute onset at any age, fluctuating consciousness, disorientation, attention disturbance, visual/tactile hallucinations, abnormal vitals, possible nystagmus or focal signs.",
 s:["Screen with DTS and confirm with bCAM, then find the cause: glucose, pulse oximetry, UA, CXR, ECG, toxic and metabolic tests","Psychiatric admission","Start long-term antidementia therapy","Reassure as sundowning"],
 sw:"Look for the trigger. Glucose and pulse oximetry first; fever points to infection (CXR and urinalysis). Older patients need an ECG since MI can manifest as confusion.",
 p:"Delirium hallucinations are classically visual (not auditory as in schizophrenia). DTS takes <20 s; bCAM <2 min."},
{c:"Confusion",l:1,v:"28M: months of unusual behavior and auditory hallucinations. He is alert, oriented, has normal vital signs and purposeful movements, no nystagmus.",
 d:["Primary psychiatric disturbance","Delirium","Dementia","Hepatic encephalopathy"],
 dw:"Table 13.2: psychiatric = onset over weeks to months, age 12-40, alert and oriented, agitated/anxious, auditory hallucinations, delusions, normal vitals, no nystagmus.",
 s:["Exclude organic causes (glucose, oxygen, toxins, medical screen) before accepting a psychiatric diagnosis","Discharge with antipsychotic only","Immediate LP and CT","Treat as dementia"],
 sw:"The diagnosis of a psychiatric disorder requires exclusion of organic causes. Careful evaluation separates psychiatric from medical origins of thought disturbance.",
 p:"Dementia: onset over months-years, usually >65, usually alert, memory impairment, word-finding difficulty; hallucinations usually absent except in Lewy body dementia."},
{c:"Confusion",l:2,v:"70M with fever, headache and new confusion. Neck stiffness present. Hemodynamically stable.",
 d:["CNS infection (meningitis/encephalitis)","Primary psychosis","Hypoglycemia","Dementia"],
 dw:"Meningitis and encephalitis alter consciousness, often with other signs of infection (fever, meningismus).",
 s:["Age-guided empirical antibiotics without delay for lumbar puncture; focal findings get prompt neuroimaging","Wait for CT then LP then antibiotics","Antipyretic and observe","Haloperidol only"],
 sw:"If CNS infection is suspected, age-guided empirical antibiotics should not be delayed for LP. Focal neurologic findings suggesting stroke or tumor prompt immediate neuroimaging.",
 p:"Blood and urine cultures in a febrile patient when admission is anticipated and the source is unclear. Paracentesis/thoracentesis if ascites or new effusion."},
{c:"Confusion",l:2,v:"58M with epilepsy, uncontrolled seizures: remains confused and drowsy 2 hours after a convulsion. Eye movements look abnormal.",
 d:["Nonconvulsive status epilepticus","Postictal state, will resolve","Delirium tremens","Stroke only"],
 dw:"Postictal state or nonconvulsive/petit mal status epilepticus can present with acute confusion; abnormal eye movements and facial myoclonus are clues.",
 s:["Bedside EEG plus empirical benzodiazepine; consider IV levetiracetam to reach therapeutic levels fast","Observe 24 h without treatment","Haloperidol","Discharge"],
 sw:"Uncontrolled seizures or suspected NCSE: empirical benzodiazepines may be considered (can cause somnolence); other antiepileptics such as IV levetiracetam to rapidly achieve therapeutic levels.",
 p:"About half of patients with convulsive status have subsequent nonconvulsive seizures on EEG; more than 15% are in NCSE."},
{c:"Confusion",l:2,v:"34F with a migraine history: 20 minutes of confusion, visual phenomena and headache, similar prior episodes that resolved on their own. Normal examination and glucose.",
 d:["Atypical (confusional) migraine","Stroke","Delirium tremens","Hypertensive encephalopathy"],
 dw:"AEIOU TIPS: Atypical migraine (confusional) is one cause. A history of previous episodes that resolved spontaneously is a clue.",
 s:["Treat migraine (e.g. prochlorperazine) after excluding critical causes","Start haloperidol","Lumbar puncture","Admit for tPA"],
 sw:"Prochlorperazine or other migraine treatment may be given if confusional migraine is suspected.",
 p:"AEIOU TIPS: Alcohol/drugs/Atypical migraine; Electrolytes/Environment/Endocrine/Encephalopathy (Wernicke)/Epilepsy; Infection; Overdose/Oxygen; Uremia; Trauma/Tumor; Insulin; Poisons/Psychosis; Stroke/Status epilepticus."},

{c:"Seizure",l:2,v:"60M staring, lip smacking, unresponsive for 12 minutes. No convulsions.",
 d:["Focal status epilepticus with impaired awareness","Syncope","Absence seizure","Psychogenic spell"],
 dw:"Table 14.1: status epilepticus time domains depend on type. Focal with impaired awareness: further seizure activity likely at 10 min, long-term sequelae likely at >60 min.",
 s:["Treat as status epilepticus (benzodiazepine first-line), low threshold for bedside EEG","Observe, self-limited","Discharge","Intubate and give propofol"],
 sw:"Tonic-clonic: 5 min / 30 min. Focal with impaired awareness: 10 min / >60 min. Absence: 10-15 min / unknown.",
 p:"Automatisms (lip smacking, picking at clothes) can arise from a frontal focus. Aura-like cognitive seizures arise from orbital frontal (olfactory hallucinations) or temporal lobe (epigastric rising, fear)."},
{c:"Seizure",l:2,v:"A woman has a 25-minute 'seizure' with eyes closed, pelvic thrusting, side-to-side head shaking, stop-and-go pattern, brief postictal period, and remembers events. No lactic acidosis or leukocytosis.",
 d:["Psychogenic nonepileptic spell","Generalized tonic-clonic status","Complex partial status","Syncope"],
 dw:"Prolonged duration, stop-and-go, pelvic thrusting, side-to-side head shaking, eyes closed, short postictal period and preserved recollection favor nonepileptic spells. Lab: usually lack leukocytosis and lactic acidosis.",
 s:["Avoid high-dose benzodiazepines; if given, monitor respiratory status closely","Load phenytoin","Intubate and start propofol","Give pentobarbital"],
 sw:"More than 10% of enrolled patients in ESETT were ultimately diagnosed with nonepileptic spells. One-third of known epileptics may also have them.",
 p:"Patients treated with high-dose benzodiazepine for a mimic need respiratory monitoring and may need ventilatory support."},
{c:"Seizure",l:3,v:"TB patient on treatment: prolonged seizures after an isoniazid overdose, refractory to two doses of benzodiazepine.",
 d:["Isoniazid-induced refractory seizures","Eclampsia","Hyponatremia","Nonepileptic spells"],
 dw:"Toxic ingestions with specialized treatment (isoniazid, lithium, TCA) are critical seizure diagnoses.",
 s:["Pyridoxine to terminate the seizures","Higher dose phenytoin only","Magnesium sulfate","Hypertonic saline"],
 sw:"Isoniazid overdose can cause prolonged seizures refractory to benzodiazepines and requires pyridoxine.",
 p:"Eclampsia: IV magnesium is the treatment of choice (refractory to magnesium: benzodiazepines or barbiturates). Hyponatremia (child/psychiatric water intoxication): hypertonic saline."},
{c:"Seizure",l:2,v:"Seizure activity in the field, no IV access.",
 d:["Active seizure / status epilepticus","Syncope","Psychogenic","Resolved seizure"],
 dw:"Patients still seizing at evaluation should be suspected to be in status epilepticus. Delays in first-line benzodiazepine are linked to higher mortality and longer seizures.",
 s:["IM midazolam 0.2 mg/kg (max 10 mg)","Rectal diazepam","IV phenytoin","Wait for IV access"],
 sw:"IM midazolam is quickly administered and superior to IV lorazepam in adults (noninferior in children). Rectal diazepam is not recommended (erratic absorption). IV lorazepam 0.1 mg/kg once access is established.",
 p:"Table 14.2 first line: diazepam 0.15-0.2 mg/kg IV (max 10 mg/dose); lorazepam 0.1 mg/kg IV (max 4 mg/dose, do NOT give IM); midazolam 0.2 mg/kg IV/IM/IN (max 10 mg/dose). Repeat every 5 min."},
{c:"Seizure",l:3,v:"68M with ischemic heart disease, benzodiazepine-refractory status epilepticus. Telemetry shows bradycardia and borderline BP.",
 d:["Refractory status in a patient at risk of hemodynamic compromise","Resolved seizure","Psychogenic spell","Syncope"],
 dw:"Hemodynamic compromise risk shapes the choice of second-line agent.",
 s:["Levetiracetam 40-60 mg/kg IV (max 4500 mg); if phenytoin is used, give at 25 mg/min with monitoring","Phenytoin at 50 mg/min","Phenobarbital 20 mg/kg rapid push only","Propofol bolus on the ward"],
 sw:"Phenytoin 15-20 mg/kg at max 50 mg/min (25 mg/min if cardiac history); may cause hypotension/dysrhythmia. Fosphenytoin up to 150 PE/min. Levetiracetam is renally cleared with fewer cardiac effects. Valproate: 20-40 mg/kg (max 3000 mg); caution hyperammonemia, hepatotoxicity.",
 p:"Lacosamide 200-400 mg IV over 10 min (watch PR/QTc). Phenobarbital 15-20 mg/kg at 50-100 mg/min. Repeat first-line dosing before second-line."},
{c:"Seizure",l:3,v:"Status epilepticus unresponsive to benzodiazepine and a second-line agent. You prepare third-line therapy.",
 d:["Refractory status epilepticus requiring intubation","Resolved seizure","Nonepileptic spell","Alcohol withdrawal"],
 dw:"Third-line therapy requires intubation, mechanical ventilation and hemodynamic support.",
 s:["Intubate, secure hemodynamics, EEG; ketamine, midazolam, pentobarbital or propofol infusion; reassess for acute brain injury, overdose, metabolic causes","Continue repeating phenytoin","Oral antiepileptic","Observe"],
 sw:"Ketamine load 1.5 mg/kg over 3-5 min (NMDA antagonist; hypotension if shock index >=0.9). Midazolam 0.2 mg/kg load, maintenance 0.05-2 mg/kg/h. Pentobarbital 5-15 mg/kg load, half-life 22 h. Propofol 1-2 mg/kg load, maintenance 20-80 mcg/kg/min (max 200); watch propofol infusion syndrome.",
 p:"Maintain cerebral perfusion: fluids and vasopressors; avoid drugs that compound hypotension in rapid sequence intubation."},
{c:"Seizure",l:2,v:"After a seizure ends, a 55M has persistent right arm weakness for 4 hours.",
 d:["Todd paralysis (but stroke must be excluded)","Psychogenic weakness","Guillain-Barre","Myasthenia"],
 dw:"A persistent focal deficit after a seizure often indicates the focal origin but may also suggest underlying ischemic or hemorrhagic stroke.",
 s:["Neuroimaging (CT/CT perfusion or MRI) to exclude stroke","Discharge","Observe 1 week","Start steroids"],
 sw:"CT perfusion helps in transient deficits consistent with Todd paralysis (acute ischemic stroke is high in the differential). MRI has increased sensitivity for subtle lesions.",
 p:"Persistent tachypnea, tachycardia, fever or abnormal BP beyond the immediate postictal period suggests toxic exposure, hypoxia, infection or acute CNS lesion."},

{c:"Vertigo",l:1,v:"68F: 20-second spinning when rolling over in bed, nausea, no hearing loss, normal neurologic exam. Hallpike test reproduces vertigo with upbeating torsional nystagmus after a few seconds' latency.",
 d:["Benign paroxysmal positional vertigo (posterior canal)","Vestibular neuritis","Meniere disease","Posterior circulation stroke"],
 dw:"Short-lived (<30 s) positional episodes, more often older adults; positive Hallpike (posterior canal).",
 s:["Epley maneuver","Meclizine and steroids","MRI brain urgently","Antiviral therapy"],
 sw:"Epley maneuver (canalith repositioning) is highly effective. Test the unaffected side first; turn head 45 degrees to the involved side, hold each position ~30 s.",
 p:"Box 15.2 Hallpike: latency 3-10 s, upbeat + torsional nystagmus toward downward ear, lasts 5-30 s, reverses on sitting, fatigable."},
{c:"Vertigo",l:2,v:"35M: constant severe vertigo for 2 days after a viral illness with nausea. Spontaneous horizontal nystagmus, positive head impulse test, normal hearing, no other neurologic findings.",
 d:["Vestibular neuritis","BPPV","Posterior circulation stroke","Meniere disease"],
 dw:"Table 15.4: vestibular neuritis = constant symptoms, positive head impulse (corrective saccade), normal hearing, no neurologic findings, Epley ineffective.",
 s:["Antiemetic/vestibular suppressant (e.g. ondansetron 4 mg IV, meclizine); consider prednisone 60 mg tapered over 2-3 weeks; do NOT do Epley","Epley maneuver","Barbecue roll","Valacyclovir"],
 sw:"Ondansetron 4 mg IV first-line; lorazepam 1-2 mg IV for intractable vomiting. Avoid discharge on oral benzodiazepines (impair vestibular habituation). Antivirals are not helpful. Steroids remain controversial: prednisone 60 mg taper, or shared decision-making.",
 p:"Do NOT perform the head impulse test in BPPV, and do NOT perform Hallpike in a patient consistent with vestibular neuritis."},
{c:"Vertigo",l:3,v:"70M with hypertension and AF: persistent vertigo, cannot sit unaided, vertical downbeating nystagmus, negative head impulse test, gait ataxia.",
 d:["Posterior circulation stroke (central vertigo)","Vestibular neuritis","BPPV","Meniere disease"],
 dw:"Table 15.3 central features: gradual or sudden, purely vertical/direction-changing or downbeating nystagmus, neurologic findings usually present. Inability to sit/walk, negative head impulse, central nystagmus.",
 s:["MRI and neurology consult; admit","Meclizine and discharge","Epley maneuver","Reassure"],
 sw:"Fig 15.3: persistent symptoms with any of central nystagmus, skew deviation, negative head impulse, focal findings, inability to sit or walk -> posterior circulation stroke (consult neurology, MRI).",
 p:"HINTS: head impulse, nystagmus (direction-changing on eccentric gaze), test of skew. Age >55 with vascular risk factors and uncertain diagnosis: admit for observation and consider MRA."},
{c:"Vertigo",l:3,v:"58M: sudden severe vertigo, headache, vomiting and truncal ataxia. Left sixth-nerve palsy.",
 d:["Cerebellar hemorrhage","Vestibular neuritis","BPPV","Meniere disease"],
 dw:"Sudden onset of severe symptoms with headache, vomiting and ataxia; ipsilateral sixth CN palsy from early brainstem compression.",
 s:["Emergent CT head and neurosurgery consultation","Meclizine and discharge","Epley maneuver","Outpatient MRI"],
 sw:"Rapidly progressive symptoms suggest impending posterior circulation hemorrhage: immediate neurology consultation, further imaging, possible anticoagulation (for ischemia). Admission usually required.",
 p:"Cerebellar function: dysmetria (finger-nose), dysdiadochokinesia, gait ataxia (wide base)."},
{c:"Vertigo",l:3,v:"62M: vertigo, nausea, loss of pain and temperature on the right face and left body, hoarseness, ataxia, right ptosis and miosis.",
 d:["Lateral medullary (Wallenberg) syndrome - PICA occlusion","Vestibular neuritis","Meniere disease","Cerebellar hemorrhage"],
 dw:"Ipsilateral facial and contralateral body pain/temperature loss, palatal/pharyngeal/laryngeal paralysis (hoarseness), ataxia, Horner syndrome = Wallenberg.",
 s:["Urgent stroke work-up: MRI and vascular imaging, neurology, admit","Antiemetic and discharge","Epley maneuver","Prednisone taper"],
 sw:"Central cause (Table 15.2). Hospitalization usually required for documented or suspected VBI or cerebellar infarction.",
 p:"VBI: advanced age with isolated new-onset vertigo, atherosclerosis; may be preceded by episodes lasting minutes; initial neuro exam can be normal. Risk of progression in the first 24-72 h."},
{c:"Vertigo",l:2,v:"25F: vertigo with blurred vision on lateral gaze. Right eye does not adduct while the left abducting eye shows nystagmus. Prior transient numbness episodes.",
 d:["Multiple sclerosis (internuclear ophthalmoplegia)","Vestibular neuritis","Wallenberg syndrome","Meniere disease"],
 dw:"INO: adducting eye shows little or no movement while the abducting eye moves normally (coarse nystagmus): interruption of the MLF, virtually pathognomonic for MS.",
 s:["Neurology referral/MRI; treat symptoms","Epley maneuver","Meclizine only","Discharge, no follow-up"],
 sw:"MS: vertigo is the presenting symptom in 7-10% and appears in a third during the course; onset usually age 20-40.",
 p:"Subclavian steal: BP difference >40 mmHg between arms and arm fatigue; check pulse and BP in both arms."},
{c:"Vertigo",l:2,v:"45F: episodic severe rotational vertigo lasting hours, tinnitus, fluctuating hearing loss, attacks in clusters, no positional nystagmus.",
 d:["Meniere disease","BPPV","Vestibular neuritis","Acoustic neuroma"],
 dw:"Triad of hearing loss, vertigo and tinnitus; pathophysiology is endolymphatic hydrops (Table 15.1).",
 s:["Symptomatic treatment and ENT/audiology referral (documentation of hearing loss is required for diagnosis)","Epley maneuver","MRI stroke protocol and admit","Steroid taper only"],
 sw:"Some cases respond to vasodilation and diuretics, and low-sodium, low-caffeine diet with smoking cessation. Diagnosis cannot typically be made in the ED.",
 p:"Acoustic neuroma: progressive unilateral hearing loss over months; rarely causes vertigo. Perilymph fistula: abnormal opening between middle and inner ear (perforated eardrum clue)."},
{c:"Vertigo",l:2,v:"60M with vertigo after head turn lasting 30 s, with positive supine roll test: head turned 90 degrees to either side causes horizontal nystagmus, more intense on the right.",
 d:["Horizontal canal BPPV","Posterior canal BPPV","Vestibular neuritis","Wallenberg syndrome"],
 dw:"Supine roll test diagnoses the horizontal canal variant; the more symptomatic side is the involved side.",
 s:["Barbecue roll (or Gufoni maneuver)","Epley maneuver","Meclizine only","IV ondansetron only"],
 sw:"Barbecue roll: head turned 90 degrees to the involved side, then rotated in 45-degree steps away, ~30 s each, finishing prone.",
 p:"Epley fails when the head is lifted too high at the third step, or when applied to a patient without BPPV (e.g. vestibular neuritis)."},
{c:"Vertigo",l:1,v:"78F: lightheadedness only when standing; BP drops 30 mmHg on standing; recently started new antihypertensive.",
 d:["Orthostatic hypotension","BPPV","Meniere disease","Cerebellar stroke"],
 dw:"Fig 15.3 triggered symptoms: Hallpike, supine roll, orthostatic vital signs.",
 s:["IV fluid bolus, review medications, screening labs (EKG, glucose, Hb/Hct, BUN/Cr)","Epley maneuver","MRI brain","Steroid taper"],
 sw:"Medical cause suspected: EKG, glucose, hemoglobin/hematocrit, BUN/creatinine, review medications. Selected ED causes: anemia, hypoglycemia, dehydration, dysrhythmia, medication.",
 p:"Aminoglycosides, anticonvulsants, aniline, quinine and minocycline have direct vestibulotoxicity."},

{c:"Headache",l:3,v:"45M: sudden severe headache after exertion, 'worst headache of life'. History of polycystic kidney disease.",
 d:["Subarachnoid hemorrhage","Tension headache","Cluster headache","Sinusitis"],
 dw:"Sudden severe pain, exertion or intercourse, polycystic kidney disease, family history of SAH, severe hypertension: SAH (Box 16.1). Critical diagnosis (Table 16.1).",
 s:["Emergent noncontrast CT head (followed by further work-up if negative)","Triptan and discharge","Oral analgesics","Outpatient MRI"],
 sw:"Thunderclap headache alone cannot indicate a serious cause but is used in prompting a search for SAH.",
 p:"Table 16.1 critical: SAH, carotid dissection, venous sinus thrombosis, CO poisoning, temporal arteritis, bacterial meningitis, encephalitis."},
{c:"Headache",l:2,v:"72F: new headache, jaw claudication, scalp tenderness. History of systemic lupus.",
 d:["Temporal arteritis","Migraine","Tension headache","Cluster headache"],
 dw:"Risk factors: age >50, female (4:1), other collagen vascular disease. Critical headache diagnosis.",
 s:["ESR/CRP and urgent treatment; arrange temporal artery evaluation","Oral analgesic and discharge","Triptan","Observe only"],
 sw:"Temporal arteritis is a critical collagen-vascular headache cause (Table 16.1).",
 p:"Other risk: previous chronic meningitis, chronic illness such as TB, parasitic or fungal infection."},
{c:"Headache",l:2,v:"28F, 3 weeks postpartum on hormone treatment: progressive headache and a seizure.",
 d:["Cerebral venous sinus thrombosis","Tension headache","Cluster headache","Temporal arteritis"],
 dw:"Female gender, pregnancy/peripartum, hormone replacement or OCP, prothrombotic conditions: CVST (Box 16.1).",
 s:["Venous imaging (CT/MR venography) and neurology","Oral analgesic","Discharge on triptan","Observe only"],
 sw:"CVST is a critical cause of headache (Table 16.1).",
 p:"Reversible cerebral vasoconstriction syndrome: episodic sudden severe pain over weeks, adrenergic/serotonergic drugs, postpartum."},
{c:"Headache",l:3,v:"22M after a punch: lucid period then headache, somnolence and a dilated right pupil.",
 d:["Epidural hematoma","Subdural hematoma","Migraine","Concussion only"],
 dw:"Traumatic injury, lucid mentation followed by acute altered mentation or somnolence, anisocoria.",
 s:["Emergent CT head and neurosurgery","Observe at home","Analgesics","Outpatient MRI"],
 sw:"Epidural hematoma (Box 16.1 8c). Subdural hematoma: alcohol dependency with or without trauma, current anticoagulation.",
 p:"Subdural hematoma is an emergent headache diagnosis (Table 16.1)."},
{c:"Headache",l:2,v:"55F: eye pain and headache coming on in a dark room, halos, previous glaucoma history.",
 d:["Acute angle-closure glaucoma","Migraine","Cluster headache","Sinusitis"],
 dw:"Not associated with usual headache patterns; age >30; history of previous glaucoma; pain increasing in a dark environment.",
 s:["Urgent ophthalmology and measurement of intraocular pressure","Oral NSAID","Triptan","Discharge"],
 sw:"Glaucoma is an emergent cause of headache (Table 16.1).",
 p:"Idiopathic intracranial hypertension (emergent): female, obese, previous benign intracranial hypertension, CSF shunt."},
{c:"Headache",l:2,v:"A family of four with morning headaches, nausea and malaise during winter. A heating appliance runs in a closed room.",
 d:["Carbon monoxide poisoning","Tension headache","Migraine","Meningitis"],
 dw:"Enclosed spaces with heating equipment, multiple household members with same symptoms, wintertime: CO poisoning (critical).",
 s:["100% oxygen and carboxyhemoglobin level; remove from exposure","Oral analgesia and discharge","Triptans","Antibiotics"],
 sw:"CO poisoning is a critical headache cause (Table 16.1).",
 p:"Mountain sickness is an emergent toxic/metabolic headache cause."},
{c:"Headache",l:2,v:"19M in a college dorm: fever, headache and altered mentation.",
 d:["Bacterial meningitis","Tension headache","Cluster headache","Migraine"],
 dw:"Risk factors: impacted living conditions (dormitories), lack of primary immunization, acute febrile illness, immunocompromise, extremes of age.",
 s:["Empirical antibiotics without delay, LP when safe","Oral analgesics","Observation","Discharge"],
 sw:"Bacterial meningitis and encephalitis are critical infectious headache causes; brain abscess is emergent.",
 p:"Increased ICP risk: history of benign intracranial hypertension, CSF shunt, congenital abnormalities, female, obese."},

/* ===== Batch 4: Ch16 rest, Ch17-22 ===== */
{c:"Headache",l:2,v:"38M, sudden worst headache of life peaking instantly, no trauma, no neurologic deficit, 4 hours ago. Age 38, no neck pain, no exertion. Neck flexion is full. He is stable.",
 d:["Thunderclap headache: SAH cannot be ruled out by the Ottawa rule","Tension headache","Migraine","Sinusitis"],
 dw:"Box 16.2 Ottawa SAH Rule: thunderclap headache (immediate peak pain) is one of the criteria. If any is present, SAH cannot be reasonably ruled out.",
 s:["Noncontrast CT head; if CT is normal and he is within 6 hours, a modern CT can exclude SAH, otherwise consider LP or CTA","Discharge with NSAID","Triptan","Skip imaging"],
 sw:"CT within 6 hours of onset with a third-generation scanner is very sensitive. Outside 6 hours, sensitivity falls, so LP or CTA is considered (Fig 16.1).",
 p:"Ottawa rule: age >40, neck pain/stiffness, witnessed LOC, onset during exertion, thunderclap onset, limited neck flexion. Applies to age 15+, nontraumatic headache, peak within 1 h."},
{c:"Headache",l:1,v:"26F with a long history of similar recurrent headaches, normal exam, no red flags. Pain 7/10, nausea, photophobia.",
 d:["Primary (benign) headache, migraine","SAH","Meningitis","Temporal arteritis"],
 dw:"Typical recurrent episode concordant with prior episodes and no red flags favors primary headache. Stereotypical recurrent patterns are typical.",
 s:["Symptom control: IV antiemetic dopamine antagonist (metoclopramide 10 mg or prochlorperazine 10 mg), NSAID or sumatriptan; no CT needed","CT head and LP","Opioids as first line","Admit for MRI"],
 sw:"Primary headaches severe or not responsive to NSAIDs: IV dopamine antagonist, SC sumatriptan 6 mg, IM/IV ketorolac 15 mg. Opioids are not first-line for primary headache. Head CT is not indicated for recurrent migraine.",
 p:"Rapid improvement of pain in the ED does NOT rule out a serious cause."},
{c:"Headache",l:2,v:"34F, 36 weeks pregnant, headache, BP 168/104, visual changes.",
 d:["Preeclampsia","Tension headache","Migraine","Cluster headache"],
 dw:"Pregnant and peripartum women may have headache from preeclampsia; also more likely IIH and cerebral vascular syndromes, plus venous sinus thrombosis.",
 s:["Treat as preeclampsia (BP control, obstetric evaluation) and consider other serious causes","Oral analgesics and discharge","Triptan","Observation only"],
 sw:"In pregnancy, consider teratogenic effects of medications and radiation/contrast exposure to the fetus when choosing treatment and imaging.",
 p:"Pregnancy: also consider venous sinus thrombosis, pituitary apoplexy, arterial dissection and stroke."},
{c:"Headache",l:2,v:"40F takes analgesics for headache about 18 days a month. Daily dull headache, normal exam.",
 d:["Medication overuse (rebound) headache","SAH","Meningitis","Temporal arteritis"],
 dw:"Analgesics taken more than 10-15 times per month raise risk of medication overuse headache; consider it after emergent conditions are eliminated.",
 s:["Exclude emergent causes, then counsel on medication overuse and arrange follow-up with a headache journal","CT and LP","Increase analgesic dose","Admit for IV opioids"],
 sw:"Patients thought to have a benign cause should have return precautions and follow-up; a headache journal helps outpatient evaluation.",
 p:"Medication overuse headache: >10-15 days/month of analgesic use."},
{c:"Headache",l:3,v:"68F: new headache, jaw claudication, scalp tenderness, sudden decreased vision in one eye.",
 d:["Temporal arteritis (giant cell arteritis)","Acute angle closure glaucoma","Migraine","Cluster headache"],
 dw:"Table 16.2: jaw, forehead or temporal pain with tender temporal arteries = temporal arteritis. Periorbital pain with sudden onset and tearing can be temporal arteritis or angle closure.",
 s:["ESR and CRP now (ESR >50 mm/h, elevated CRP); treat urgently to protect vision","Oral NSAID and discharge","CT head only","Reassure"],
 sw:"Table 16.4: temporal arteritis ESR greater than 50 mm/h and elevated CRP. One or both may be normal in up to 5% of biopsy-proven cases.",
 p:"Temporal arteritis may present with eye pain and decreased vision but no injection."},
{c:"Headache",l:3,v:"58M, headache with bacterial meningitis suspected. LP is not available immediately.",
 d:["Bacterial meningitis","Migraine","Tension headache","Cluster headache"],
 dw:"Infectious headache; if bacterial meningitis is under consideration, empiric antibiotic therapy should be given as soon as possible since treatment is time-sensitive.",
 s:["Start empiric antibiotics now, before completion of CSF testing","Wait for LP results","Analgesia only","Discharge"],
 sw:"It is appropriate to begin treatment of potential bacterial meningitis before completion of confirmatory CSF testing.",
 p:"LP for opening pressure + CSF: SAH (RBCs), infection (WBCs, protein, positive Gram stain, low glucose), IIH (high opening pressure), cryptococcal meningitis."},

{c:"Diplopia",l:1,v:"55F: double vision that persists in the right eye when the left eye is covered. It improves when she looks through a pinhole.",
 d:["Monocular diplopia from refractive error","Cranial nerve VI palsy","Myasthenia gravis","Basilar artery thrombosis"],
 dw:"Monocular diplopia persists with the normal eye closed and is most commonly due to abnormal refraction, which resolves with a pinhole.",
 s:["Ophthalmology referral for refraction; slit lamp if lens dislocation or retinal pathology is suspected","Emergent MRI/MRA","Admit for cranial nerve workup","Thiamine"],
 sw:"Lens dislocation or retinal abnormality will not resolve with pinhole testing. Key causes in Box 17.1: dry eyes, corneal irregularity, cataract, lens dislocation, retinal wrinkles, conversion disorder.",
 p:"Binocular diplopia disappears when either eye is covered; monocular persists in the affected eye with the other closed."},
{c:"Diplopia",l:2,v:"52M with hypertension and diabetes: sudden double vision in all directions except lateral gaze to the affected side. Right ptosis, right eye down and out, pupil NORMAL size and reactive. Mild orbital pain.",
 d:["Microvascular ischemic CN III palsy (pupil-sparing)","Posterior communicating artery aneurysm","Cavernous sinus thrombosis","Myasthenia gravis"],
 dw:"CN III palsy: ptosis, down-and-out eye, multidirectional diplopia. Pupil spared with microvascular ischemia (diabetes, hypertension, smoking); an aneurysm usually has a dilated pupil.",
 s:["Typical pupil-sparing CN III palsy with vascular risk factors may be discharged with neuro-ophthalmology follow-up; image urgently if any doubt","Emergent LP","Antibiotics","Epley maneuver"],
 sw:"Pupil sparing is not an absolute rule: rare compressive third nerve palsies spare the pupil. Imaging if any equivocation or atypical features.",
 p:"CN III also supplies levator palpebrae (ptosis) and parasympathetics (pupil dilation when compressed)."},
{c:"Diplopia",l:3,v:"48F: sudden right CN III palsy with a dilated, fixed pupil, severe headache and ptosis.",
 d:["Intracranial aneurysm compressing CN III","Microvascular ischemia","Orbital myositis","Thyroid eye disease"],
 dw:"Aneurysmal CN III palsy: pupillary involvement from compression of parasympathetic fibers; a Tier 1 critical diagnosis with 26-67% mortality if ruptured.",
 s:["Emergent MRA/CTA/DSA of the brain and neurosurgical consultation","Discharge with follow-up","Oral steroids","Observe"],
 sw:"Fig 17.3: aneurysmal CN III palsy (pupillary involvement) is critical/emergent; evaluate with MRA, CTA or DSA.",
 p:"Pediatric new-onset CN III, IV or VI palsy, or ipsilateral involvement of more than one oculomotor nerve, needs emergent imaging."},
{c:"Diplopia",l:2,v:"24M after a fall: vertical-torsional diplopia worse when looking down and toward the nose, with head tilt toward the opposite shoulder.",
 d:["CN IV (trochlear) palsy","CN VI palsy","CN III palsy","Thyroid eye disease"],
 dw:"Fig 17.2: trochlear palsy: superior oblique off. Rotational diplopia that worsens on downward gaze toward the nose, extorsion on down gaze. Trauma commonly affects CN IV (sits against the tentorium).",
 s:["Examine for associated deficits, image if trauma or atypical, arrange follow-up","Emergent LP","Intubate","Start thiamine"],
 sw:"Patients struggle with stairs, reading and watching TV in bed. A head tilt to the side opposite the palsy compensates, which can hide an isolated CN IV palsy.",
 p:"CN IV: superior oblique. CN VI: lateral rectus. CN III: all others, plus levator and pupil."},
{c:"Diplopia",l:2,v:"60M: horizontal diplopia worse looking to the left, left eye does not abduct. Papilledema, headache, nausea and vomiting.",
 d:["CN VI palsy from raised intracranial pressure (IIH or mass)","Microvascular CN VI palsy","Myasthenia gravis","Thyroid eye disease"],
 dw:"CN VI palsy: horizontal diplopia on gaze toward the affected side. CN VI has the longest course, is the most common cranial nerve palsy (about 50%) and can be bilateral with raised ICP. Papilledema with headache and vomiting points to IIH.",
 s:["Neuroimaging (MRI/MRV) and LP with opening pressure","Epley","Discharge reassurance","Eye patch only"],
 sw:"An isolated CN VI palsy with eye pain in a chronic diabetic suggests microvascular ischemia; with papilledema, think IIH or mass.",
 p:"Isolated CN III, IV or VI should not have other associated symptoms."},
{c:"Diplopia",l:2,v:"34F: intermittent diplopia and ptosis that worsen late in the day and improve with rest. Bedside ice pack on the eyelid improves ptosis.",
 d:["Myasthenia gravis","Multiple sclerosis","Basilar artery thrombosis","Thyroid eye disease"],
 dw:"Fluctuating muscle weakness, ptosis and diplopia worse with activity and better with rest = myasthenia (Tier 2, untreated crisis mortality 42%).",
 s:["Ice test and assess respiratory function (NIF/FVC); neurology and admit if bulbar or respiratory involvement","Emergent LP","Antibiotics","Discharge on steroids"],
 sw:"Fig 17.3: ice test for myasthenia. Check swallowing and respiratory reserve; intermittent diplopia with ptosis suggests a neuromuscular junction disorder.",
 p:"Botulism: dysarthria, dysphagia, dry mouth, autonomic dysreflexia and pupillary dysfunction (untreated mortality 60%)."},
{c:"Diplopia",l:3,v:"66M: sudden diplopia, vertigo, slurred speech, nausea. Fluctuating, painless, with vascular risk factors. Vertical gaze skew.",
 d:["Impending basilar artery thrombosis / brainstem stroke","Myasthenia gravis","CN VI palsy from microvascular disease","Orbital myositis"],
 dw:"Tier 1: basilar artery thrombosis with brainstem ischemia, vertigo, dysarthria, other cranial nerve involvement, stroke risk factors; untreated mortality 70-90%.",
 s:["IV fluid bolus, emergent stroke evaluation for reperfusion/anticoagulation, MRI brain plus MRA/CTA head and neck","Meclizine","Outpatient MRI","Ice test only"],
 sw:"Fig 17.4: if signs of an impending basilar artery occlusion (risk factors, vertigo, dysarthria), give IV fluid bolus and do emergent stroke evaluation for reperfusion therapy/anticoagulation.",
 p:"Sudden, painless, fluctuating symptoms raise concern for basilar occlusion; gradual and progressive symptoms point toward a brainstem mass."},
{c:"Diplopia",l:2,v:"52M alcoholic, malnourished: diplopia, nystagmus, ataxia, confusion.",
 d:["Wernicke encephalopathy","Miller-Fisher syndrome","Myasthenia gravis","Cavernous sinus thrombosis"],
 dw:"Table 17.2: Wernicke: nystagmus, ataxia, altered mental status, ophthalmoplegia; alcoholism and nutritional deficiency. Thiamine-dependent failure, untreated mortality 20%.",
 s:["Emergent thiamine; also give to alcohol abuse or bariatric surgery history","Antibiotics and LP","Outpatient neurology","Ice test"],
 sw:"Fig 17.4 empirical pre-diagnostic management: nystagmus, altered mental status, ataxia -> emergent thiamine.",
